name: BC Controller PR Gate

on:
  pull_request:
    paths:
      - 'research/**'
      - 'tests/**'
      - '.github/workflows/bc-controller-pr.yml'
      - '.github/workflows/bc-research-controller.yml'

permissions:
  contents: read

jobs:
  controller-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Run controller regression and harness tests
        run: python -m pytest -q tests/test_resume_budget.py tests/test_feature_library.py tests/test_harness_contracts.py tests/test_autonomous_hypothesis.py tests/test_evidence_calibration.py
      - name: Run AIOS conformance checks
        run: |
          python research/aios_conformance.py
          python research/adversarial_conformance.py
