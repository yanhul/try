name: AIOS Workload Conformance

on:
  workflow_dispatch:

jobs:
  workload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run bounded AIOS workload adapter
        run: python -m aios.adapter
