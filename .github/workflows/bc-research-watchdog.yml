name: BC Research Durable Watchdog

# Liveness safety net only. The canonical controller is the sole durable
# state/evidence mutator. This workflow only dispatches it.
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - BC Research Controller
    types:
      - completed
    branches:
      - main
  schedule:
    - cron: '*/2 * * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: try-bc-research-continuation-main
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Dispatch canonical controller when idle and non-terminal
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          state="$(gh api repos/${GITHUB_REPOSITORY}/contents/research/bc_lifecycle_state.json --jq '.content' | base64 -d)"
          terminal="$(jq -r '.campaign_terminal // false' <<<"$state")"
          durable_terminal="$(jq -r '.terminal // false' <<<"$state")"
          if [ "$terminal" = "true" ] || [ "$durable_terminal" = "true" ]; then
            echo "CAMPAIGN_TERMINAL=true; no dispatch."
            exit 0
          fi

          intent="$(gh api "repos/${GITHUB_REPOSITORY}/contents/research/continuation_intent.json" --jq '.content' 2>/dev/null | base64 -d || true)"
          intent_status="$(jq -r '.status // "ABSENT"' <<<"$intent" 2>/dev/null || echo ABSENT)"
          echo "CONTINUATION_RECEIPT_PRESENT status=$intent_status"
          if ! jq -e '(.schema_version == 1) and (.target_ref == "main") and ((.created_by_run_id | type) == "number") and (.created_by_run_id > 0) and ((.campaign_id // "") != "") and ((.checkpoint_seq | type) == "number") and (.checkpoint_seq >= 0) and (.status == "PENDING" or .status == "DISPATCHED" or .status == "STALE")' >/dev/null <<<"$intent"; then
            echo "DURABLE_QUEUE_UNAUTHORIZED; watchdog will not dispatch."
            exit 0
          fi

          source_id="$(jq -r '.created_by_run_id' <<<"$intent")"
          state_campaign="$(jq -r '.campaign_id // ""' <<<"$state")"
          intent_campaign="$(jq -r '.campaign_id // ""' <<<"$intent")"
          state_checkpoint="$(jq -r '.checkpoint_seq // -1' <<<"$state")"
          intent_checkpoint="$(jq -r '.checkpoint_seq // -2' <<<"$intent")"
          state_current="$(jq -r '.current_bc // -1' <<<"$state")"
          intent_current="$(jq -r '.current_bc // -2' <<<"$intent")"
          state_next="$(jq -r '.next_bc // -1' <<<"$state")"
          intent_next="$(jq -r '.next_bc // -2' <<<"$intent")"
          checkpoint_mismatch=false
          if [ "$state_campaign" != "$intent_campaign" ] || [ "$state_checkpoint" != "$intent_checkpoint" ] || [ "$state_current" != "$intent_current" ] || [ "$state_next" != "$intent_next" ]; then
            checkpoint_mismatch=true
            echo "DURABLE_QUEUE_CHECKPOINT_MISMATCH; reconcile only from current main artifacts."
          fi
          controller_workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/bc-research-controller.yml" --jq '.id')"
          source_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${source_id}")"
          if [ "$(jq -r '.workflow_id' <<<"$source_run")" != "$controller_workflow_id" ] || \
             [ "$(jq -r '.repository.full_name' <<<"$source_run")" != "$GITHUB_REPOSITORY" ] || \
             [ "$(jq -r '.head_branch' <<<"$source_run")" != "main" ] || \
             [ "$(jq -r '.status' <<<"$source_run")" != "completed" ] || \
             [ "$(jq -r '.conclusion' <<<"$source_run")" != "success" ]; then
            echo "DURABLE_QUEUE_SOURCE_INVALID source_run_id=$source_id; watchdog will not dispatch."
            exit 0
          fi

          if [ "$intent_status" = "DISPATCHED" ]; then
            dispatch_id="$(jq -r '.dispatch_run_id // empty' <<<"$intent")"
            if ! [[ "$dispatch_id" =~ ^[0-9]+$ ]]; then
              dispatch_id="$(jq -r '.dispatch_run_url // empty' <<<"$intent" | sed -n 's#.*/runs/\([0-9][0-9]*\).*#\1#p')"
            fi
            if [[ "$dispatch_id" =~ ^[0-9]+$ ]]; then
              run_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${dispatch_id}")"
              run_workflow_id="$(jq -r '.workflow_id // 0' <<<"$run_state")"
              run_repo="$(jq -r '.repository.full_name // ""' <<<"$run_state")"
              run_branch="$(jq -r '.head_branch // ""' <<<"$run_state")"
              run_sha="$(jq -r '.head_sha // ""' <<<"$run_state")"
              expected_sha="$(jq -r '.dispatch_head_sha // empty' <<<"$intent")"
              run_status="$(jq -r '.status // ""' <<<"$run_state")"
              run_conclusion="$(jq -r '.conclusion // ""' <<<"$run_state")"
              if [ "$run_workflow_id" = "$controller_workflow_id" ] && [ "$run_repo" = "$GITHUB_REPOSITORY" ] && [ "$run_branch" = "main" ] && { [ -z "$expected_sha" ] || [ "$run_sha" = "$expected_sha" ]; }; then
                if [ "$run_status" != "completed" ]; then
                  echo "CONTINUATION_RECEIPT_ACTIVE id=$dispatch_id status=$run_status; no duplicate."
                  exit 0
                fi
                if [ "$run_conclusion" = "success" ]; then
                  echo "CONTINUATION_RECEIPT_COMPLETED_SUCCESS id=$dispatch_id; not active, reconciling current durable frontier."
                else
                  echo "CONTINUATION_RECEIPT_STALE id=$dispatch_id conclusion=$run_conclusion; recover through continuation lane."
                fi
              else
                echo "CONTINUATION_RECEIPT_INVALID id=$dispatch_id; fail closed."
                exit 0
              fi
            else
              echo "CONTINUATION_RECEIPT_MISSING_ID; recover through continuation lane."
            fi
          fi

          active="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow bc-research-controller.yml --limit 20 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting")] | length')"
          if [ "${active:-0}" -gt 0 ]; then
            echo "CONTROLLER_ACTIVE count=$active; no duplicate dispatch."
            exit 0
          fi

          git fetch origin main
          git reset --hard origin/main
          reg_status="$(python -m research.candidate_registration status 2>&1 || true)"
          case "$reg_status" in
            REGISTRATION_REQUIRED)
              echo "DURABLE_QUEUE_VALID_REGISTRATION_REQUIRED; dispatching registration-only controller pass."
              gh workflow run bc-research-controller.yml --repo "$GITHUB_REPOSITORY" --ref main
              echo "BC_CONTROLLER_REGISTRATION_ONLY_DISPATCHED=true"
              exit 0
              ;;
            READY|DISCOVERY_READY|RETRY_READY)
              echo "DURABLE_FRONTIER_VALID status=$reg_status checkpoint_mismatch=$checkpoint_mismatch"
              ;;
            BLOCKED:*)
              echo "WATCHDOG_BLOCKED_DURABLE_EVIDENCE $reg_status"
              exit 0
              ;;
            *)
              echo "WATCHDOG_BLOCKED_UNKNOWN_REGISTRATION_STATUS $reg_status"
              exit 0
              ;;
          esac

          echo "DURABLE_FRONTIER_AUTHORIZED source_run_id=$source_id status=$intent_status; dispatching continuation reconciler."
          gh workflow run bc-research-continuation.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "BC_CONTINUATION_RECONCILER_DISPATCHED=true"
