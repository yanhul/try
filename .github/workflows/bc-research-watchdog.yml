name: BC Research Durable Watchdog

# Liveness safety net only. The canonical controller is the sole durable
# state/evidence mutator. This workflow only dispatches it.
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - BC Research Controller
    types:
      - completed
    branches:
      - main
  schedule:
    - cron: '*/2 * * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: try-bc-research-continuation-main
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Dispatch canonical controller when idle and non-terminal
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          state="$(gh api repos/${GITHUB_REPOSITORY}/contents/research/bc_lifecycle_state.json --jq '.content' | base64 -d)"
          terminal="$(jq -r '.campaign_terminal // false' <<<"$state")"
          durable_terminal="$(jq -r '.terminal // false' <<<"$state")"
          if [ "$terminal" = "true" ] || [ "$durable_terminal" = "true" ]; then
            echo "CAMPAIGN_TERMINAL=true; no dispatch."
            exit 0
          fi

          intent="$(gh api repos/${GITHUB_REPOSITORY}/contents/research/continuation_intent.json --jq '.content' 2>/dev/null | base64 -d || true)"
          intent_status="$(jq -r '.status // "ABSENT"' <<<"$intent" 2>/dev/null || echo ABSENT)"
          if [ "$intent_status" = "DISPATCHED" ]; then
            dispatch_url="$(jq -r '.dispatch_run_url // empty' <<<"$intent")"
            dispatch_id="$(printf '%s' "$dispatch_url" | sed -n 's#.*/runs/\([0-9][0-9]*\).*#\1#p')"
            if [ -n "$dispatch_id" ]; then
              run_state="$(gh run view "$dispatch_id" --json status,conclusion)"
              run_status="$(printf '%s' "$run_state" | jq -r '.status')"
              run_conclusion="$(printf '%s' "$run_state" | jq -r '.conclusion // empty')"
              if [ "$run_status" != "completed" ] || [ "$run_conclusion" = "success" ]; then
                echo "CONTINUATION_RECEIPT_ACTIVE status=$run_status conclusion=$run_conclusion; no duplicate dispatch."
                exit 0
              fi
              echo "CONTINUATION_RECEIPT_STALE outcome=$run_conclusion; watchdog will recover."
            else
              echo "CONTINUATION_RECEIPT_INVALID; watchdog will recover."
            fi
          fi

          active="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow bc-research-controller.yml --limit 20 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting")] | length')"
          if [ "${active:-0}" -gt 0 ]; then
            echo "CONTROLLER_ACTIVE count=$active; no duplicate dispatch."
            exit 0
          fi

          echo "CONTROLLER_IDLE_NONTERMINAL intent=$intent_status; dispatching canonical main controller."
          gh workflow run bc-research-controller.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "BC_CONTROLLER_DISPATCHED=true"
