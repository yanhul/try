name: BC Research Durable Watchdog

# Safety net for liveness: the campaign itself is durable; this workflow only
# re-enters the existing controller from persisted state. Policy/evidence/OOS
# authority remain enforced by the controller and AIOS boundary.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: try-bc-research-controller-main
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RESEARCH_MAX_ITERATIONS: 8
      RESEARCH_MAX_RESUME_RETRIES: 3
      RESEARCH_AGENT_COMMAND: python research/provider_router.py
      RESEARCH_PROVIDER_ORDER: gemini
      RESEARCH_PROVIDER_MIN_INTERVAL_SECONDS: 5
      RESEARCH_PROVIDER_RATE_RETRIES: 1
      RESEARCH_PROVIDER_BACKOFF_CAP_SECONDS: 120
      RESEARCH_PROVIDER_CONTEXT_CHAR_LIMIT: 12000
      RESEARCH_PROVIDER_MAX_FORBIDDEN_FINGERPRINTS: 80
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.1-flash-lite
      GITHUB_TOKEN: ${{ github.token }}
      AIOS_SOURCE: ${{ github.workspace }}/aios-authority
      AIOS_AUTHORITY_SECRET: ${{ secrets.AIOS_AUTHORITY_SECRET }}
    steps:
      - name: Checkout TRY
        uses: actions/checkout@v4
      - name: Checkout pinned AIOS authority
        uses: actions/checkout@v4
        with:
          repository: yanhul/AIOS
          ref: 151f386683934edd6e124d1ae69bd95a68b3ecbf
          path: aios-authority
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Verify harness contracts
        run: python -m pytest -q tests/test_campaign_controller.py tests/test_harness_contracts.py tests/test_provider_router_contract.py tests/test_autonomous_hypothesis.py
      - name: Run durable controller continuation
        shell: bash
        run: |
          set -o pipefail
          python research/campaign_controller.py 2>&1 | tee watchdog.log
      - name: Persist durable state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- research/bc_lifecycle_state.json research/bc_queue.json research/autonomous_candidates research/failure_analysis research/frozen_candidates research/oos research/lineage.jsonl research/discovery research/.aios_authority research/bc*_validation_result.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "WATCHDOG_NO_STATE_CHANGE"
            exit 0
          fi
          git commit -m "research: watchdog persist autonomous state [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "WATCHDOG_STATE_PERSISTED"
              exit 0
            fi
            git fetch origin main
            git reset --hard origin/main
            sleep $((attempt * 2))
          done
          echo "WATCHDOG_STATE_PERSIST_FAILED" >&2
          exit 1
