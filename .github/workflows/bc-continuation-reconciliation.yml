name: BC Continuation Reconciliation Guard

on:
  pull_request:
    paths:
      - "research/continuation_reconciliation.py"
      - "tests/test_continuation_reconciliation.py"
      - "tests/test_continuation_contract.py"
      - ".github/workflows/bc-research-continuation.yml"
      - ".github/workflows/bc-research-watchdog.yml"
      - ".github/workflows/bc-continuation-reconciliation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run continuation reconciliation regression tests
        run: python -m pytest -q tests/test_continuation_reconciliation.py tests/test_continuation_contract.py
      - name: Compile reconciliation gate
        run: python -m py_compile research/continuation_reconciliation.py
