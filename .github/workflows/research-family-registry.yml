name: Research Family Registry Conformance

on:
  push:
    paths:
      - "engine/**"
      - "research/**"
      - "tests/**"
      - ".github/workflows/research-family-registry.yml"
  pull_request:
    paths:
      - "engine/**"
      - "research/**"
      - "tests/**"
      - ".github/workflows/research-family-registry.yml"

jobs:
  family-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Run full test suite
        run: pytest
