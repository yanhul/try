name: TRY Autonomous Repair

on:
  workflow_run:
    workflows: ["BC Research Controller"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Failed BC Research Controller run ID"
        required: true
        type: string
      base_sha:
        description: "Exact failed head SHA"
        required: true
        type: string
      source_branch:
        description: "Exact failed source branch"
        required: true
        type: string

permissions: {}

concurrency:
  group: try-autorepair-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: true

env:
  RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
  BASE_SHA: ${{ github.event.workflow_run.head_sha || inputs.base_sha }}
  SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch || inputs.source_branch }}

jobs:
  repair:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'failure' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Checkout trusted AIOS repair authority
        uses: actions/checkout@v4
        with:
          repository: yanhul/AIOS
          ref: main
          path: trusted-aios
          persist-credentials: false

      - name: Checkout exact failed TRY revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: target
          clean: true
          persist-credentials: false

      - name: Capture failed controller evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$RUNNER_TEMP/ci-failure.log" || true
          test -s "$RUNNER_TEMP/ci-failure.log" || printf '%s\n' "controller_failed" > "$RUNNER_TEMP/ci-failure.log"

      - name: Recover immutable repair-research evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/research"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n "repair-research-$RUN_ID" -D "$RUNNER_TEMP/research" || true
          if [ -f "$RUNNER_TEMP/research/latest.json" ]; then
            cat "$RUNNER_TEMP/research/latest.json" >> "$RUNNER_TEMP/ci-failure.log"
          fi

      - name: Run bounded research-aware repair loop
        working-directory: target
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted-aios
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_RUN_ID: ${{ env.RUN_ID }}
          AIOS_REPAIR_LOG: ${{ runner.temp }}/ci-failure.log
          AIOS_REPAIR_EVIDENCE: ${{ runner.temp }}/research/latest.json
          TRY_REPAIR_PROVIDER_URL: ${{ secrets.TRY_REPAIR_PROVIDER_URL }}
          TRY_REPAIR_PROVIDER_TOKEN: ${{ secrets.TRY_REPAIR_PROVIDER_TOKEN }}
        run: python -m research.autonomous_repair

      - name: Publish verified repair branch
        working-directory: target
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/trusted-aios
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_RUN_ID: ${{ env.RUN_ID }}
          AIOS_REPAIR_SOURCE_BRANCH: ${{ env.SOURCE_BRANCH }}
          AIOS_REPAIR_PROPOSALS_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          status="$(python -c 'import json; print(json.load(open("repair-result.json"))["status"])')"
          test "$status" = PASS
          attempt="$(python -c 'import json; print(json.load(open("repair-result.json")).get("attempt",3))')"
          echo "AIOS_REPAIR_PASS_ATTEMPT=$attempt" >> "$GITHUB_ENV"
          AIOS_REPAIR_PASS_ATTEMPT="$attempt" python "${{ github.workspace }}/trusted-aios/scripts/ci_repair_publish.py"
          branch="aios/autorepair/$RUN_ID"
          git push --set-upstream "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base "$SOURCE_BRANCH" --head "$branch" --title "fix: autonomous repair for BC controller run $RUN_ID" --body "Bounded loop: external research evidence → TRY repair provider → AIOS authority mutation → independent verification; up to 3 attempts."

      - name: Upload autonomous repair evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: try-autonomous-repair-$RUN_ID
          path: |
            target/repair-result*.json
            target/repair-proposal-*.json
            $RUNNER_TEMP/ci-failure.log
          if-no-files-found: ignore
          retention-days: 7
