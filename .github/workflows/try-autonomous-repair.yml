name: TRY Autonomous Repair

on:
  workflow_run:
    workflows: ["BC Research Controller"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Failed BC Research Controller run ID"
        required: true
        type: string
      base_sha:
        description: "Exact failed head SHA"
        required: true
        type: string
      source_branch:
        description: "Exact failed source branch"
        required: true
        type: string

permissions: {}

concurrency:
  group: try-autorepair-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

env:
  RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
  BASE_SHA: ${{ github.event.workflow_run.head_sha || inputs.base_sha }}
  SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch || inputs.source_branch }}

jobs:
  repair:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'failure' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout trusted AIOS repair authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: yanhul/AIOS
          ref: cb38387f2dd0785136fcc6434a49e43233bad648
          path: trusted-aios
          persist-credentials: false

      - name: Checkout exact failed TRY revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: target
          clean: true
          persist-credentials: false

      - name: Checkout trusted repair controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: yanhul/try
          ref: 54d96c59547ea3790eda3dfbf2a15291f5cb5dc7
          path: trusted-try
          clean: true
          persist-credentials: false

      - name: Verify trusted controller contains strict persisted-effect guards
        working-directory: trusted-try
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path("research/autonomous_repair.py").read_text(encoding="utf-8")
          required = (
              "applied_attempt_identity_mismatch",
              "applied_provider_identity_mismatch",
              "effect_identity_digest_mismatch",
              "effect_attempt_identity_mismatch",
              "_validate_persisted_effect",
          )
          missing = [marker for marker in required if marker not in source]
          if missing:
              raise SystemExit("trusted_controller_security_guard_missing:" + ",".join(missing))
          print("trusted controller strict persisted-effect guards verified")
          PY

      - name: Validate exact failed controller run identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/target-run.json"
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          run = json.loads(Path(os.environ["RUNNER_TEMP"] + "/target-run.json").read_text())
          head_repository = run.get("head_repository") or {}
          repository = run.get("repository") or {}
          expected = {
              "id": int(os.environ["RUN_ID"]),
              "name": "BC Research Controller",
              "conclusion": "failure",
              "head_sha": os.environ["BASE_SHA"],
              "head_branch": os.environ["SOURCE_BRANCH"],
          }
          for key, value in expected.items():
              if run.get(key) != value:
                  raise SystemExit(f"repair_target_run_mismatch:{key}")
          if not re.fullmatch(r"[0-9a-fA-F]{40}", str(run.get("head_sha", ""))):
              raise SystemExit("repair_target_sha_invalid")
          if repository.get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("repair_target_repository_mismatch")
          if head_repository.get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("repair_target_source_repository_mismatch")
          print("verified exact failed controller run, repository, branch and SHA")
          PY

      - name: Capture failed controller evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$RUNNER_TEMP/ci-failure.log"
          test -s "$RUNNER_TEMP/ci-failure.log"

      - name: Recover immutable repair-research evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/research"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n "repair-research-$RUN_ID" -D "$RUNNER_TEMP/research"
          test -s "$RUNNER_TEMP/research/latest.json"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          path = Path(__import__("os").environ["RUNNER_TEMP"]) / "research" / "latest.json"
          evidence = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(evidence, dict):
              raise SystemExit("repair_research_evidence_not_mapping")
          if evidence.get("schema_version") != 1 or evidence.get("research_only") is not True:
              raise SystemExit("repair_research_evidence_schema_invalid")
          if evidence.get("candidate_status") != "UNTRUSTED_EVIDENCE":
              raise SystemExit("repair_research_evidence_trust_boundary_invalid")
          digest = evidence.get("evidence_digest")
          unsigned = dict(evidence)
          unsigned.pop("evidence_digest", None)
          canonical = json.dumps(unsigned, sort_keys=True, ensure_ascii=False, separators=(",", ":"))
          expected = hashlib.sha256(canonical.encode("utf-8")).hexdigest()
          if not isinstance(digest, str) or digest != expected:
              raise SystemExit("repair_research_evidence_digest_invalid")
          import os, re
          expected_run = os.environ["RUN_ID"]
          expected_repo = os.environ["GITHUB_REPOSITORY"]
          expected_sha = os.environ["BASE_SHA"].lower()
          if str(evidence.get("source_run_id", "")) != expected_run:
              raise SystemExit("repair_research_source_run_mismatch")
          if evidence.get("source_repository") != expected_repo:
              raise SystemExit("repair_research_source_repository_mismatch")
          source_sha = evidence.get("source_sha")
          if not isinstance(source_sha, str) or not re.fullmatch(r"[0-9a-f]{40}", source_sha):
              raise SystemExit("repair_research_source_sha_invalid")
          if source_sha != expected_sha:
              raise SystemExit("repair_research_source_sha_mismatch")
          print("verified research evidence digest, source run/repository/SHA and untrusted-evidence boundary")
          PY
          cat "$RUNNER_TEMP/research/latest.json" >> "$RUNNER_TEMP/ci-failure.log"

      - name: Verify external AIOS authority in isolated process
        working-directory: .
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted-try:${{ github.workspace }}/trusted-aios
          AIOS_REPAIR_RUN_ID: ${{ env.RUN_ID }}
          AIOS_REPAIR_AUTHORITY_DIR: ${{ secrets.AIOS_REPAIR_AUTHORITY_DIR }}
          AIOS_REPAIR_CONTRACT_ID: ${{ secrets.AIOS_REPAIR_CONTRACT_ID }}
          AIOS_REPAIR_PERMIT_ID: ${{ secrets.AIOS_REPAIR_PERMIT_ID }}
          AIOS_REPAIR_ATTESTATION_SECRET: ${{ secrets.AIOS_REPAIR_ATTESTATION_SECRET }}
          AIOS_REPAIR_AUTHORITY_GATE_RECEIPT: ${{ runner.temp }}/aios-authority-gate.json
          RUNNER_TEMP: ${{ runner.temp }}
        run: python "${{ github.workspace }}/trusted-try/research/verify_repair_authority.py"

      - name: Run bounded research-aware repair loop
        working-directory: target
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted-try:${{ github.workspace }}/trusted-aios:${{ github.workspace }}/target
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_RUN_ID: ${{ env.RUN_ID }}
          AIOS_REPAIR_LOG: ${{ runner.temp }}/ci-failure.log
          AIOS_REPAIR_EVIDENCE: ${{ runner.temp }}/research/latest.json
          TRY_REPAIR_PROVIDER_URL: ${{ secrets.TRY_REPAIR_PROVIDER_URL }}
          TRY_REPAIR_PROVIDER_TOKEN: ${{ secrets.TRY_REPAIR_PROVIDER_TOKEN }}
          TRY_REPAIR_CHECKPOINT_TOKEN: ${{ secrets.TRY_REPAIR_CHECKPOINT_TOKEN }}
          AIOS_REPAIR_AUTHORITY_DIR: ${{ secrets.AIOS_REPAIR_AUTHORITY_DIR }}
          AIOS_REPAIR_CONTRACT_ID: ${{ secrets.AIOS_REPAIR_CONTRACT_ID }}
          AIOS_REPAIR_PERMIT_ID: ${{ secrets.AIOS_REPAIR_PERMIT_ID }}
          AIOS_REPAIR_AUTHORITY_GATE_RECEIPT: ${{ runner.temp }}/aios-authority-gate.json
        run: python "${{ github.workspace }}/trusted-try/research/autonomous_repair.py"

      - name: Verify candidate and submit only through independent COMMIT adapter
        working-directory: target
        if: ${{ success() }}
        env:
          AIOS_REPAIR_RUN_ID: ${{ env.RUN_ID }}
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_CONTRACT_ID: ${{ secrets.AIOS_REPAIR_CONTRACT_ID }}
          AIOS_REPAIR_PERMIT_ID: ${{ secrets.AIOS_REPAIR_PERMIT_ID }}
          AIOS_REPAIR_AUTHORITY_GATE_RECEIPT: ${{ runner.temp }}/aios-authority-gate.json
          AIOS_COMMIT_ADAPTER_URL: ${{ secrets.AIOS_COMMIT_ADAPTER_URL }}
          AIOS_COMMIT_ADAPTER_TOKEN: ${{ secrets.AIOS_COMMIT_ADAPTER_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$AIOS_REPAIR_RUN_ID" && test -n "$AIOS_REPAIR_SHA"
          status="$(python -c 'import json; print(json.load(open("repair-result.json"))["status"])')"
          if [ "$status" != PASS ]; then
            echo "::error::BLOCKED: repair result is not PASS; no candidate submission"
            exit 2
          fi
          # Include newly created source files without staging candidate contents for commit.
          while IFS= read -r -d '' path; do
            case "$path" in
              repair-result*.json|repair-proposal-*.json|.aios/*) continue ;;
            esac
            git add -N -- "$path"
          done < <(git ls-files --others --exclude-standard -z)
          patch="$RUNNER_TEMP/aios-repair-$AIOS_REPAIR_RUN_ID.patch"
          git diff --binary --no-ext-diff -- . ':(exclude)repair-result*.json' ':(exclude)repair-proposal-*.json' > "$patch"
          test -s "$patch"
          python - "$AIOS_REPAIR_RUN_ID" "$GITHUB_REPOSITORY" "$AIOS_REPAIR_SHA" "$patch" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          run_id, repository, base_sha, patch_path = sys.argv[1:]
          result_path = Path("repair-result.json")
          result = json.loads(result_path.read_text(encoding="utf-8"))
          if not isinstance(result, dict) or result.get("status") != "PASS":
              raise SystemExit("repair_result_not_pass")
          result.update({
              "run_id": run_id,
              "repository": repository,
              "base_sha": base_sha,
              "patch_sha256": hashlib.sha256(Path(patch_path).read_bytes()).hexdigest(),
          })
          result_path.write_text(json.dumps(result, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          print("candidate evidence manifest bound to exact run/repository/base SHA and patch digest")
          PY
          if [ -z "$AIOS_COMMIT_ADAPTER_URL" ] || [ -z "$AIOS_COMMIT_ADAPTER_TOKEN" ]; then
            echo "::error::BLOCKED: independent COMMIT adapter is not configured; candidate remains artifact-only"
            exit 2
          fi
          python "$GITHUB_WORKSPACE/trusted-try/research/repair_external_integrations.py" submit-commit \
            --run-id "$AIOS_REPAIR_RUN_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --base-sha "$AIOS_REPAIR_SHA" \
            --contract-id "$AIOS_REPAIR_CONTRACT_ID" \
            --permit-id "$AIOS_REPAIR_PERMIT_ID" \
            --patch "$patch" \
            --repair-result "repair-result.json" \
            --authority-receipt "$AIOS_REPAIR_AUTHORITY_GATE_RECEIPT"
      - name: Upload autonomous repair evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: try-autonomous-repair-$RUN_ID
          path: |
            target/repair-result*.json
            target/repair-proposal-*.json
            $RUNNER_TEMP/ci-failure.log
            $RUNNER_TEMP/aios-repair-$RUN_ID.patch
          if-no-files-found: ignore
          retention-days: 7
