name: Deploy TRY Repair Worker (Cloudflare)

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type DEPLOY to deploy the production Worker"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-repair-worker-production
  cancel-in-progress: false

jobs:
  deploy-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloudflare/try-repair-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TRY_PROVIDER_TOKEN: ${{ secrets.TRY_PROVIDER_TOKEN }}
      TRY_OPERATION_RECEIPT_PRIVATE_KEY: ${{ secrets.TRY_OPERATION_RECEIPT_PRIVATE_KEY }}
      TRY_OPERATION_RECEIPT_KEY_ID: ${{ vars.TRY_OPERATION_RECEIPT_KEY_ID }}
      AIOS_TRY_OPERATION_KEYRING: '{"try.repair":{"key_id":"try-operation-ed25519-prod-v1","public_key":"y+8C1Ph7x929L+oAuzgWIiHA/MOLgoFhGxqzdligo3M=","scopes":["try.operation.receipt.verify"],"revoked":false}}'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail closed on missing deployment credentials
        shell: bash
        env:
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRM_PRODUCTION" != "DEPLOY" ]]; then
            echo "::error::Production deployment requires the exact confirmation DEPLOY"
            exit 1
          fi
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GEMINI_API_KEY TRY_PROVIDER_TOKEN TRY_OPERATION_RECEIPT_PRIVATE_KEY TRY_OPERATION_RECEIPT_KEY_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub Actions secret is missing: $name"
              exit 1
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: cloudflare/try-repair-worker/pyproject.toml

      - name: Install Worker runtime tooling
        run: uv sync --group dev --no-install-project

      - name: Deploy Worker and Durable Object migration
        shell: bash
        run: |
          set -euo pipefail
          set +x
          uv run --no-sync pywrangler deploy 2>&1 | tee deploy.log
          WORKER_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | tail -n 1 || true)"
          if [[ -z "$WORKER_URL" ]]; then
            echo "::error::Could not extract the deployed workers.dev URL; refusing to claim deployment verification."
            exit 1
          fi
          echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"
          echo "Deployed Worker URL: $WORKER_URL"

      - name: Install TRY-owned secrets on the Worker
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python -c 'import json, os; print(json.dumps({"GEMINI_API_KEY": os.environ["GEMINI_API_KEY"], "TRY_PROVIDER_TOKEN": os.environ["TRY_PROVIDER_TOKEN"], "TRY_OPERATION_RECEIPT_PRIVATE_KEY": os.environ["TRY_OPERATION_RECEIPT_PRIVATE_KEY"], "TRY_OPERATION_RECEIPT_KEY_ID": os.environ["TRY_OPERATION_RECEIPT_KEY_ID"]}))' |
            uv run --no-sync pywrangler secret bulk

      - name: Verify health and Durable Object checkpoint persistence
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/yanhul/AIOS.git ../aios
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          base = os.environ["WORKER_URL"].rstrip("/")
          token = os.environ["TRY_PROVIDER_TOKEN"]
          run_id = os.environ["GITHUB_RUN_ID"]
          attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          sha = os.environ["GITHUB_SHA"]
          request_id = f"deploy-{run_id}-{attempt}"

          def request(method, path, body=None, authenticated=True):
              headers = {"Accept": "application/json", "User-Agent": "try-deploy-smoke/1.0"}
              if authenticated:
                  headers["Authorization"] = f"Bearer {token}"
              data = None
              if body is not None:
                  headers["Content-Type"] = "application/json"
                  data = json.dumps(body, separators=(",", ":")).encode()
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return response.status, json.loads(response.read())
              except urllib.error.HTTPError as exc:
                  raw = exc.read()
                  try:
                      payload = json.loads(raw)
                  except Exception:
                      payload = {}
                  return exc.code, payload

          # Cloudflare edge may briefly return a transient denial/not-ready response
          # immediately after deployment. Poll with a hard deadline; never treat a
          # persistent 403/503 as success.
          import time
          health = None
          last_health = {}
          health_deadline = time.monotonic() + 120
          health_attempt = 0
          while time.monotonic() < health_deadline and health_attempt < 24:
              health_attempt += 1
              remaining = max(1, health_deadline - time.monotonic())
              health_req = urllib.request.Request(
                  base + "/healthz",
                  headers={"Accept": "application/json", "User-Agent": "try-deploy-smoke/1.0"},
                  method="GET",
              )
              try:
                  with urllib.request.urlopen(health_req, timeout=min(10, remaining)) as response:
                      health_status = response.status
                      health_headers = response.headers
                      health_raw = response.read(4096)
              except urllib.error.HTTPError as exc:
                  health_status = exc.code
                  health_headers = exc.headers
                  health_raw = exc.read(4096)
              except Exception as exc:
                  health_status = 0
                  health_headers = {}
                  health_raw = type(exc).__name__.encode()
              safe_headers = {
                  key: health_headers.get(key)
                  for key in ("content-type", "server", "cf-ray", "cf-cache-status")
                  if health_headers.get(key)
              }
              try:
                  health_payload = json.loads(health_raw) if health_raw else {}
              except Exception:
                  health_payload = {}
              last_health = {
                  "http_status": health_status,
                  "headers": safe_headers,
                  "body_excerpt": health_raw.decode("utf-8", errors="replace")[:2000],
              }
              print(json.dumps({
                  "health_attempt": health_attempt,
                  "http_status": health_status,
                  "cf_ray": safe_headers.get("cf-ray"),
                  "worker_status": health_payload.get("status"),
              }, sort_keys=True))
              if health_status == 200 and health_payload.get("status") == "READY":
                  health = health_payload
                  break
              # Retry only transient edge/upstream/not-ready outcomes. Other 4xx
              # responses are contract failures and should fail immediately.
              if health_status not in (0, 403, 429, 500, 502, 503, 504):
                  break
              remaining = health_deadline - time.monotonic()
              if remaining > 0 and health_attempt < 24:
                  time.sleep(min(5, remaining))
          if health is None:
              print("HEALTH_DIAGNOSTIC=" + json.dumps(last_health, sort_keys=True))
              raise AssertionError("worker_health_not_ready_after_120_seconds")
          assert health.get("provider") == "gemini", "unexpected_provider"
          assert health.get("checkpoint_store_bound") is True, "durable_object_binding_missing"
          assert health.get("provider_token_configured") is True, "provider_token_missing"
          assert health.get("operation_receipt_signing_configured") is True, "operation_receipt_signer_not_ready"
          print(json.dumps({
              "health": "READY",
              "provider": health.get("provider"),
              "model": health.get("model"),
              "checkpoint_store_bound": health.get("checkpoint_store_bound"),
          }, sort_keys=True))

          probe = {
              "request_id": f"gemini-probe-{run_id}-{attempt}",
              "repository": "yanhul/try",
              "sha": sha,
              "attempt": 1,
              "failure": {
                  "summary": "Production deployment smoke probe; no source repair requested.",
                  "ci_failure_log_tail": "Cloudflare Worker production Gemini connectivity check.",
              },
              "source_snapshot": {
                  "README.md": "This file is included only as a bounded connectivity probe. Do not propose a repair."
              },
          }
          status, proposal = request("POST", "/v1/repair/propose", probe)
          assert status == 200, f"gemini_provider_probe_http_{status}"
          proposal_status = "HOLD" if proposal.get("status") == "HOLD" else proposal.get("schema")
          assert proposal_status == "HOLD" or proposal_status == 2, "gemini_provider_probe_invalid_response"
          print(json.dumps({
              "gemini_api_probe": "RESPONDED",
              "proposal_schema_or_status": proposal_status,
          }, sort_keys=True))

          # Verify the durable operation receipt with AIOS's pinned Ed25519 key.
          import hashlib
          import sys
          sys.path.insert(0, "../aios")
          from core.try_repair_provider import lookup_proposal
          request_digest = hashlib.sha256(json.dumps(
              probe, sort_keys=True, separators=(",", ":"), allow_nan=False
          ).encode("utf-8")).hexdigest()
          verified = lookup_proposal(
              request_id=probe["request_id"],
              expected_request_digest=request_digest,
              expected_repository=probe["repository"],
              expected_sha=probe["sha"],
              expected_attempt=probe["attempt"],
          )
          assert verified and verified.get("status") == "COMPLETED", "AIOS_signed_receipt_verification_failed"
          assert verified["operation_receipt"].get("key_id") == "try-operation-ed25519-prod-v1", "unexpected_receipt_key_id"
          print(json.dumps({
              "signed_receipt": "VERIFIED_BY_AIOS",
              "receipt_key_id": verified["operation_receipt"]["key_id"],
              "request_digest_verified": True,
              "proposal_digest_verified": True,
          }, sort_keys=True))

          initial = {
              "request_id": request_id,
              "repository": "yanhul/try",
              "sha": sha,
              "attempt": 1,
              "phase": "OBSERVE",
              "state": "WORKING",
          }
          status, created = request("POST", "/v1/repair/checkpoint", initial)
          assert status == 200 and created.get("persisted") is True, "checkpoint_write_failed"

          status, stored = request("GET", f"/v1/repair/checkpoint/{request_id}")
          assert status == 200, "checkpoint_read_after_write_failed"
          for key in ("request_id", "repository", "sha", "attempt", "phase", "state", "version"):
              assert stored.get(key) == created.get(key), f"checkpoint_roundtrip_mismatch:{key}"

          conflict = dict(initial, repository="yanhul/AIOS")
          status, _ = request("POST", "/v1/repair/checkpoint", conflict)
          assert status == 409, f"identity_conflict_not_rejected:{status}"

          invalid_transition = dict(initial, phase="PERSIST")
          status, _ = request("POST", "/v1/repair/checkpoint", invalid_transition)
          assert status == 409, f"invalid_transition_not_rejected:{status}"

          terminal_without_digest = dict(initial, phase="PERSIST", state="DONE")
          status, _ = request("POST", "/v1/repair/checkpoint", terminal_without_digest)
          assert status == 409, f"terminal_without_digest_not_rejected:{status}"

          status, final_record = request("GET", f"/v1/repair/checkpoint/{request_id}")
          assert status == 200 and final_record.get("version") == 1, "rejected_writes_mutated_checkpoint"

          print(json.dumps({
              "checkpoint_write_read": "PASS",
              "identity_conflict_rejected": True,
              "invalid_transition_rejected": True,
              "terminal_without_digest_rejected": True,
              "rejected_writes_preserved_record": True,
              "request_id": request_id,
          }, sort_keys=True))
          PY
