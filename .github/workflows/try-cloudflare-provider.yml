name: TRY Cloudflare Repair Provider

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/try-repair-worker/**"
      - ".github/workflows/try-cloudflare-provider.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare/try-repair-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Validate Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy Worker
        run: uv run pywrangler deploy
      - name: Set TRY provider secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_PROJECT_ID: ${{ vars.GEMINI_PROJECT_ID }}
          TRY_PROVIDER_TOKEN: ${{ secrets.TRY_PROVIDER_TOKEN }}
        run: |
          test -n "$GEMINI_API_KEY"
          test -n "$GEMINI_PROJECT_ID"
          test -n "$TRY_PROVIDER_TOKEN"
          printf '%s' "$GEMINI_API_KEY" | uv run pywrangler secret put GEMINI_API_KEY
          printf '%s' "$GEMINI_PROJECT_ID" | uv run pywrangler secret put GEMINI_PROJECT_ID
          printf '%s' "$TRY_PROVIDER_TOKEN" | uv run pywrangler secret put TRY_PROVIDER_TOKEN
      - name: Smoke test
        env:
          WORKER_URL: ${{ vars.TRY_REPAIR_WORKER_URL }}
        run: |
          test -n "$WORKER_URL"
          curl --fail --silent --show-error "$WORKER_URL/healthz"
