name: TRY Cloudflare Repair Provider

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/try-repair-worker/**"
      - ".github/workflows/try-cloudflare-provider.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare/try-repair-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Validate Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy Worker
        run: uv run pywrangler deploy
      - name: Set TRY provider secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_PROJECT_ID: ${{ vars.GEMINI_PROJECT_ID }}
          TRY_PROVIDER_TOKEN: ${{ secrets.TRY_PROVIDER_TOKEN }}
        run: |
          test -n "$GEMINI_API_KEY"
          test -n "$GEMINI_PROJECT_ID"
          test -n "$TRY_PROVIDER_TOKEN"
          printf '%s' "$GEMINI_API_KEY" | uv run pywrangler secret put GEMINI_API_KEY
          printf '%s' "$GEMINI_PROJECT_ID" | uv run pywrangler secret put GEMINI_PROJECT_ID
          printf '%s' "$TRY_PROVIDER_TOKEN" | uv run pywrangler secret put TRY_PROVIDER_TOKEN
      - name: Worker conformance tests
        run: uv run python -m unittest discover -s tests -v

      - name: Smoke test
        env:
          WORKER_URL: ${{ vars.TRY_REPAIR_WORKER_URL }}
        run: |
          test -n "$WORKER_URL"
          curl --fail --silent --show-error "$WORKER_URL/healthz"

      - name: E2E AIOS provider client -> Worker -> Gemini
        env:
          TRY_REPAIR_PROVIDER_URL: ${{ vars.TRY_REPAIR_WORKER_URL }}
          TRY_REPAIR_PROVIDER_TOKEN: ${{ secrets.TRY_PROVIDER_TOKEN }}
          TRY_REPAIR_PROVIDER_TIMEOUT: "180"
          E2E_REPOSITORY: ${{ github.repository }}
          E2E_SHA: ${{ github.sha }}
        run: |
          test -n "$TRY_REPAIR_PROVIDER_URL"
          test -n "$TRY_REPAIR_PROVIDER_TOKEN"
          git clone --depth 1 https://github.com/yanhul/aios.git ../aios
          PYTHONPATH=../aios python - <<'PY'
          import json
          import os
          from core.try_repair_provider import health, propose

          ready = health()
          if ready.get("status") != "READY":
              raise SystemExit(f"AIOS provider health not READY: {ready}")

          payload = propose(
              request_id=f"e2e-worker-gemini-{os.environ.get('GITHUB_RUN_ID', 'local')}",
              repository=os.environ["E2E_REPOSITORY"],
              sha=os.environ["E2E_SHA"],
              attempt=1,
              failure={
                  "kind": "SyntaxError",
                  "ci_failure_log_tail": "broken.py:1: SyntaxError: invalid syntax",
              },
              source={"broken.py": "def repair_me(:\\n    return 1\\n"},
          )
          if payload.get("status") == "HOLD":
              raise SystemExit(f"AIOS provider client returned HOLD: {payload}")
          if payload.get("schema") != 2:
              raise SystemExit(f"AIOS provider client returned invalid schema: {payload}")
          files = payload.get("files")
          if not isinstance(files, list) or not files:
              raise SystemExit(f"AIOS provider client returned no files: {payload}")
          if payload.get("request_id") != f"e2e-worker-gemini-{os.environ.get('GITHUB_RUN_ID', 'local')}":
              raise SystemExit(f"AIOS provider client lost request identity: {payload}")
          if payload.get("base_sha") != os.environ["E2E_SHA"]:
              raise SystemExit(f"AIOS provider client lost base SHA: {payload}")
          if payload.get("attempt") != 1:
              raise SystemExit(f"AIOS provider client lost attempt identity: {payload}")
          print(json.dumps({
              "status": "PASS",
              "client": "yanhul/aios:core.try_repair_provider",
              "provider_response": "schema-2",
              "file_count": len(files),
              "paths": [item["path"] for item in files],
              "base_sha_verified": True,
              "attempt_verified": True,
          }, sort_keys=True))
          PY
