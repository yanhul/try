name: TRY AIOS Durable Runtime Integration

on:
  pull_request:
    paths:
      - "engine/**"
      - "aios/**"
      - "tests/test_aios_durable_runtime_integration.py"
      - "tests/test_try_durable_runtime_adapter.py"
      - "tests/test_aios_durable_runtime_worker.py"
      - "docs/ABSORPTION_AGENTKIT_JAVIS_EXISTING_RUNTIME.md"
      - ".github/workflows/aios-durable-runtime-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AIOS_REF: 2df36ab2aa6d936830f7e8afa14e395c780cf19b

jobs:
  durable-runtime-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned AIOS authority implementation
        uses: actions/checkout@v4
        with:
          repository: yanhul/AIOS
          ref: ${{ env.AIOS_REF }}
          path: .aios-core
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exercise AIOS authority boundary and TRY durable scheduler adapter
        env:
          PYTHONPATH: ${{ github.workspace }}/.aios-core
        run: python -m unittest discover -s tests -p "test_*durable_runtime*.py" -v
