name: TRY Durable Checkpoint Conformance

on:
  pull_request:
    paths:
      - "cloudflare/try-repair-worker/**"
      - ".github/workflows/try-checkpoint-conformance.yml"
  push:
    branches:
      - main
      - feat/cloudflare-durable-repair-checkpoints
    paths:
      - "cloudflare/try-repair-worker/**"
      - ".github/workflows/try-checkpoint-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/try-repair-worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Worker SDK
        run: uv sync --all-groups
      - name: Compile Worker and tests
        run: uv run python -m py_compile src/entry.py tests/test_entry.py tests/test_checkpoint_contract.py
      - name: Run Worker conformance tests
        run: uv run python -m unittest discover -s tests -v
      - name: Verify direct unittest entrypoint discovers checkpoint tests
        run: uv run python tests/test_entry.py -v
      - name: Compile and test autonomous repair checkpoint client
        working-directory: .
        run: |
          python -m py_compile research/autonomous_repair.py research/repair_checkpoint.py tests/test_repair_checkpoint_client.py
          python -m unittest discover -s tests -p test_repair_checkpoint_client.py -v
