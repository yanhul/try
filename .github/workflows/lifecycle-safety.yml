name: Lifecycle Safety

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Run lifecycle safety tests
        run: python -m pytest -q tests/test_oos_lifecycle_target.py
