name: CI Event Receiver

# Event-driven notification ingress. This workflow does not decide or repair
# workloads; it records a durable, idempotent notification envelope for the user.
on:
  repository_dispatch:
    types: [ci_failure]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-event-receiver
  cancel-in-progress: false

jobs:
  receive:
    if: ${{ github.event_name == 'repository_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record failure event
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p notifications
          python - <<'PY'
          import json, os, re
          from datetime import datetime, timezone
          from pathlib import Path

          payload = json.loads(os.environ["PAYLOAD"] or "{}")

          required = ("repo", "workflow", "run_id", "run_url", "sha", "branch", "conclusion", "message")
          missing = [key for key in required if not str(payload.get(key) or "").strip()]
          if missing:
              raise SystemExit(f"ci_failure event missing required fields: {', '.join(missing)}")

          repo = str(payload["repo"]).strip()
          workflow = str(payload["workflow"]).strip()
          allowed_sources = {
              ("yanhul/AIOS", "CI"),
              ("yanhul/try", "AIOS Workload Conformance"),
              ("yanhul/try", "BC Research Controller"),
              ("yanhul/android-ai-assistant", "Android CI"),
              ("yanhul/RX50", "RX50 Autonomous Evidence Loop"),
          }
          if (repo, workflow) not in allowed_sources:
              raise SystemExit(f"ci_failure event has untrusted source: {repo}/{workflow}")

          run_id = str(payload["run_id"]).strip()
          if not run_id.isdigit() or int(run_id) <= 0:
              raise SystemExit("ci_failure event requires a positive numeric run_id")

          run_url = str(payload["run_url"]).strip()
          expected_url = f"https://github.com/{repo}/actions/runs/{run_id}"
          if run_url != expected_url:
              raise SystemExit("ci_failure event run_url does not match repo/run_id")

          sha = str(payload["sha"]).strip()
          if not re.fullmatch(r"[0-9a-fA-F]{40}", sha):
              raise SystemExit("ci_failure event requires a 40-character commit sha")

          branch = str(payload["branch"]).strip()
          conclusion = str(payload["conclusion"]).strip().lower()
          if conclusion in {"success", "cancelled"}:
              raise SystemExit(f"ci_failure event cannot record conclusion={conclusion}")

          message = str(payload["message"]).strip()

          p = Path("notifications/ci_events.jsonl")
          existing = []
          if p.exists():
              for line in p.read_text(encoding="utf-8").splitlines():
                  if line.strip():
                      existing.append(json.loads(line))

          prior = next(
              (item for item in existing if str(item.get("run_id") or "") == run_id),
              None,
          )

          if prior is not None:
              event = prior
              print(json.dumps({"deduplicated": True, "run_id": run_id}, sort_keys=True))
          else:
              event = {
                  "received_at": datetime.now(timezone.utc).isoformat(),
                  "event": "ci_failure",
                  "source_repo": repo,
                  "workflow": workflow,
                  "run_id": run_id,
                  "run_url": run_url,
                  "sha": sha,
                  "branch": branch,
                  "conclusion": conclusion,
                  "message": message,
              }
              with p.open("a", encoding="utf-8") as f:
                  f.write(json.dumps(event, sort_keys=True) + "\n")
              print(json.dumps(event, sort_keys=True))

          Path("notifications/latest_ci_failure.json").write_text(
              json.dumps(event, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Persist notification event
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notifications/ci_events.jsonl notifications/latest_ci_failure.json
          if git diff --cached --quiet; then
            echo "Replay detected; no duplicate notification commit required."
            exit 0
          fi
          git commit -m "notify: record CI failure event [skip ci]"
          git push origin HEAD:main
