name: Pytest

on:
  push:
    paths:
      - 'engine/**'
      - 'tests/**'
      - 'research/**'
      - 'pyproject.toml'
      - '.github/workflows/pytest.yml'
  pull_request:
    paths:
      - 'engine/**'
      - 'tests/**'
      - 'research/**'
      - 'pyproject.toml'
      - '.github/workflows/pytest.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run test suite
        run: python -m pytest
      # CI merge gate: ASTRA executable evolution boundary; same-head verification.
