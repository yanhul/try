name: AIOS Central Workload Conformance

on:
  push:
    branches: [main]
    paths:
      - 'aios/**'
      - 'engine/aios_evolution.py'
      - 'engine/aios_boundary.py'
      - 'engine/research_pipeline.py'
      - 'tests/test_aios_evolution_adapter.py'
      - 'research/AIOS_RESEARCH_CONTRACT.md'
      - 'research/aios_conformance.py'
      - 'AIOS_BOUNDARY.md'
      - '.github/workflows/aios-central-conformance.yml'
  pull_request:
    paths:
      - 'aios/**'
      - 'engine/aios_evolution.py'
      - 'engine/aios_boundary.py'
      - 'engine/research_pipeline.py'
      - 'tests/test_aios_evolution_adapter.py'
      - 'research/AIOS_RESEARCH_CONTRACT.md'
      - 'research/aios_conformance.py'
      - 'AIOS_BOUNDARY.md'
      - '.github/workflows/aios-central-conformance.yml'

permissions:
  contents: read

env:
  AIOS_REF: 1979e828ee2b16dbd0601e2404abdc4a560dab49

jobs:
  central-workload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout pinned AIOS core
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: yanhul/AIOS
          ref: ${{ env.AIOS_REF }}
          path: .aios-core
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install central runner dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Verify TRY to AIOS evolution lifecycle
        env:
          AIOS_ROOT: ${{ github.workspace }}/.aios-core
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/.aios-core
        run: python -m unittest discover -s tests -p 'test_aios_evolution_adapter.py' -v

      - name: Run research workload through central AIOS runner
        env:
          PYTHONPATH: .aios-core
        run: |
          python .aios-core/scripts/run_workload_adapter.py \
            --workload-id yanhul/try \
            --execution-id "try-${GITHUB_SHA}" \
            --cwd . \
            --problem "Evaluate the bounded research harness contract and expose its governed result." \
            --timeout-seconds 300 \
            -- python ./aios/adapter.py
