name: TRY Live Durable Checkpoint E2E

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/live_checkpoint_e2e.py"
      - ".github/workflows/try-live-checkpoint-e2e.yml"

permissions:
  contents: read

jobs:
  live-checkpoint-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify live Durable Object write, readback, and process restart
        env:
          WORKER_URL: ${{ secrets.TRY_REPAIR_WORKER_URL }}
          WORKER_TOKEN: ${{ secrets.TRY_PROVIDER_TOKEN }}
        run: python scripts/live_checkpoint_e2e.py
