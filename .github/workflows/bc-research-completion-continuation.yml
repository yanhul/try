name: BC Research Completion Continuation

on:
  workflow_run:
    workflows: [BC Research Controller]
    types: [completed]
  workflow_dispatch:

concurrency:
  # Serialize continuation handling with the controller so the DISPATCHED receipt is committed before the successor can read state.
  group: try-bc-research-controller-main
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  continue:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest durable state
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Consume continuation intent
        id: consume
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          intent_path="research/continuation_intent.json"
          if [ ! -f "$intent_path" ]; then
            echo "CONTINUATION_NONE"
            echo "continue=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          status="$(jq -r '.status // empty' "$intent_path")"
          created_by_run_id="$(jq -r '.created_by_run_id // empty' "$intent_path")"
          target_ref="$(jq -r '.target_ref // empty' "$intent_path")"

          if [ "$status" != "PENDING" ] || [ "$target_ref" != "main" ]; then
            echo "CONTINUATION_NONE status=$status target_ref=$target_ref"
            echo "continue=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$created_by_run_id" != "$SOURCE_RUN_ID" ]; then
            echo "CONTINUATION_STALE_INTENT created_by_run_id=$created_by_run_id source_run_id=$SOURCE_RUN_ID"
            echo "continue=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          target_sha="$(git rev-parse HEAD)"
          echo "CONTINUATION_EVENT_RECEIVED source_run_id=$SOURCE_RUN_ID source_sha=$SOURCE_SHA target_sha=$target_sha"
          run_url="$(gh workflow run bc-research-controller.yml --repo "$GITHUB_REPOSITORY" --ref main)"
          test -n "$run_url"
          echo "CONTINUATION_DISPATCHED url=$run_url"

          jq --arg url "$run_url" --arg sha "$target_sha" --arg source "$SOURCE_RUN_ID" \
            '.status="DISPATCHED" | .dispatch_run_url=$url | .dispatch_head_sha=$sha | .completion_event_run_id=($source|tonumber)' \
            "$intent_path" > "$intent_path.tmp"
          mv "$intent_path.tmp" "$intent_path"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$intent_path"
          git commit -m "research: record completion-event continuation [skip ci]"

          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

          echo "CONTINUATION_RECEIPT_PERSISTED"
          echo "continue=true" >> "$GITHUB_OUTPUT"
