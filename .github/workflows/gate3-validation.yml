name: Gate 3 Validation Authority

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gate3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Gate 1 strict bootstrap
        run: python audit_bc1_fast_gate.py
      - name: Gate 2 authority regression suite
        run: python -m pytest tests/test_oos_lifecycle_semantics.py tests/test_oos_state_migration.py tests/test_oos_controller_adversarial.py
      - name: Gate 3 authority and mutation tests
        run: python -m pytest tests/test_gate3_strict.py
      - name: Compile Gate 3 authority modules
        run: python -m py_compile audit_bc3_fast_gate.py research/autonomous_hypothesis.py engine/autonomous_evaluator.py research/validation_policy.py