# Discovery frontier refresh after structural exhaustion
# Controller trigger: verify discovery absorption after lineage-binding hardening
name: BC Research Controller
# strict-verification-trigger: implementation-family-binding-v1
# strategy-research-resume: strict RPD datetime test isolation

# Durable bounded campaign: fixed policy + durable controller resume.
# Fast event-driven continuation dispatch is owned by bc-research-continuation.yml.
# G4B autonomous launch lane.
# Agent cannot modify policy, evidence, promotion, budget, or terminal rules.
# Each invocation executes at most one BC and persists before the next dispatch.
on:
  workflow_dispatch:
  # Daily research scan: 09:00 GMT+7 = 02:00 UTC
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: try-bc-research-continuation-main
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      RESEARCH_MAX_ITERATIONS: 1
      RESEARCH_MAX_RESUME_RETRIES: 10
      RESEARCH_AGENT_COMMAND: python research/provider_router.py
      RESEARCH_PROVIDER_ORDER: gemini
      RESEARCH_PROVIDER_MIN_INTERVAL_SECONDS: 8
      RESEARCH_PROVIDER_RATE_RETRIES: 3
      RESEARCH_PROVIDER_RPD_LIMIT: 450
      RESEARCH_PROVIDER_BACKOFF_CAP_SECONDS: 120
      RESEARCH_PROVIDER_CONTEXT_CHAR_LIMIT: 12000
      RESEARCH_PROVIDER_MAX_FORBIDDEN_FINGERPRINTS: 80
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_PROJECT_ID: ${{ vars.GEMINI_PROJECT_ID }}
      GEMINI_MODEL: gemini-3.5-flash-lite
      GITHUB_TOKEN: ${{ github.token }}
      AIOS_SOURCE: ${{ github.workspace }}/aios-authority
      AIOS_AUTHORITY_SECRET: ${{ secrets.AIOS_AUTHORITY_SECRET }}
      AIOS_AUTHORITY_SHA: 3ebdedf0b1aa51084e2d7cefc1b6c5eb211dd00e
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rebase controller workspace onto latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          echo "CONTROLLER_BASE=$(git rev-parse HEAD)"
      - name: Checkout pinned AIOS authority
        uses: actions/checkout@v4
        with:
          repository: yanhul/AIOS
          ref: absorb/verl-strict-lineage
          path: aios-authority
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Verify public Gemini project configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GEMINI_PROJECT_ID}" || { echo "GEMINI_PROJECT_ID is required (public project ID; configure it as a repository variable)" >&2; exit 1; }
          echo "GEMINI_PROJECT_ID configured"
      - name: Run research feature and harness tests
        run: python -m pytest -q tests/test_feature_library.py tests/test_harness_contracts.py tests/test_autonomous_hypothesis.py tests/test_evidence_calibration.py tests/test_campaign_controller.py tests/test_candidate_registration_lineage.py tests/test_continuation_contract.py tests/test_provider_router_contract.py tests/test_provider_router_translation_normalization.py tests/test_system_ingestion.py tests/test_hypothesis_novelty.py tests/test_campaign_terminal_contract.py tests/test_oos_lifecycle_target.py tests/test_repair_research.py tests/test_discovery_absorption.py tests/test_implementation_absorption.py tests/test_composite_evaluator.py tests/test_execution_outcome.py tests/test_trajectory_evidence.py
      - name: Run AIOS static conformance
        run: python research/aios_conformance.py
      - name: Run AIOS runtime adversarial conformance
        run: python -m research.adversarial_conformance
      - name: Upload AIOS full conformance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aios-full-conformance-${{ github.run_id }}
          path: |
            research/aios_conformance_receipt.json
            research/aios_conformance_evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Bootstrap strict research lifecycle
        run: python research/bootstrap_lifecycle.py
      - name: Check strict fast-resume eligibility
        id: resume_gate
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_OUTPUT_PATH="$GITHUB_OUTPUT"
          python - <<'PY'
          import json, os
          from pathlib import Path
          state_path=Path('research/bc_lifecycle_state.json')
          state=json.loads(state_path.read_text()) if state_path.exists() else {}
          phase=state.get('phase'); error=str(state.get('last_error') or '')
          retry=int(state.get('retry_count',0)); current_bc=state.get('current_bc')
          required=[Path('research/bc_queue.json'),Path('research/autonomous_candidates'),Path('research/failure_analysis'),Path('research/discovery')]
          retryable_error=(not error.startswith(('provider_project_id_missing:GEMINI','provider_not_configured:GEMINI')) and error.startswith(('PROVIDER_FAIL ','HOLD_PROVIDER_ROUTER','HOLD_PROVIDER_REPAIR','HOLD_EVALUATOR','PROVIDER_CALIBRATION_FAIL ','HOLD_OOS_EXECUTOR_OR_AUTHORITY')))
          eligible=(not state.get('campaign_terminal') and not state.get('discovery_refresh_required') and phase=='WAIT_RETRY' and retryable_error and 0<=retry<10 and isinstance(current_bc,int) and all(p.exists() for p in required))
          with Path(os.environ['GITHUB_OUTPUT_PATH']).open('a') as out: out.write(f"fast={'true' if eligible else 'false'}\n")
          print(f"FAST_RESUME_{'ELIGIBLE' if eligible else 'INELIGIBLE'} bc={current_bc} retry={retry} error={error}")
          PY
      - name: Check durable campaign budget before discovery
        id: budget_gate
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_OUTPUT_PATH="$GITHUB_OUTPUT"
          python - <<'PY'
          import os,json
          from pathlib import Path
          from research.campaign_controller import _start_new_campaign_epoch,reconcile_campaign_state
          policy=json.loads(Path('research/campaign_policy.json').read_text()); state_path=Path('research/bc_lifecycle_state.json'); state=json.loads(state_path.read_text()) if state_path.exists() else {}; budget=int(policy['max_screening_candidates']); _start_new_campaign_epoch(state,policy); _,start,screened=reconcile_campaign_state(state,budget); exhausted=bool(state.get('campaign_terminal')) or screened>=budget; Path(os.environ['GITHUB_OUTPUT_PATH']).open('a').write(f"exhausted={'true' if exhausted else 'false'}\n"); print(f"CAMPAIGN_BUDGET_{'EXHAUSTED' if exhausted else 'AVAILABLE'} start_bc={start} screened={screened}/{budget}");
          if exhausted: state_path.write_text(json.dumps(state,indent=2,sort_keys=True)+'\n')
          PY
      - name: Broad public-source discovery
        if: ${{ steps.resume_gate.outputs.fast != 'true' && steps.budget_gate.outputs.exhausted != 'true' }}
        run: python research/discovery_scout.py
      - name: Ingest every discovered system
        if: ${{ steps.resume_gate.outputs.fast != 'true' && steps.budget_gate.outputs.exhausted != 'true' }}
        run: python research/discovery/system_ingestion.py
      - name: Audit executable source lanes
        if: ${{ steps.resume_gate.outputs.fast != 'true' && steps.budget_gate.outputs.exhausted != 'true' }}
        run: python research/discovery/source_audit.py
      - name: Compile constrained discovery primitives
        if: ${{ steps.resume_gate.outputs.fast != 'true' && steps.budget_gate.outputs.exhausted != 'true' }}
        run: python research/discovery_compiler.py
      - name: Persist discovery absorption proof
        if: ${{ steps.resume_gate.outputs.fast != 'true' && steps.budget_gate.outputs.exhausted != 'true' }}
        run: python research/discovery/absorption.py
      - name: Persist governed implementation absorption
        if: ${{ steps.resume_gate.outputs.fast != 'true' && steps.budget_gate.outputs.exhausted != 'true' }}
        run: python research/discovery/implementation_absorption.py
      - name: Clear discovery refresh latch after discovery
        if: ${{ steps.resume_gate.outputs.fast != 'true' && steps.budget_gate.outputs.exhausted != 'true' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/bc_lifecycle_state.json')
          if p.exists():
              state=json.loads(p.read_text())
              if state.get('discovery_refresh_required'):
                  state['discovery_refresh_required']=False
                  p.write_text(json.dumps(state,indent=2,sort_keys=True)+'\n')
                  print('DISCOVERY_REFRESH_LATCH_CLEARED')
          PY
      - name: Repair durable OOS evidence before campaign resume
        id: oos_repair
        if: ${{ steps.resume_gate.outputs.fast != 'true' && steps.budget_gate.outputs.exhausted != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python research/repair_oos_evidence.py
          echo "repair_ok=true" >> "$GITHUB_OUTPUT"
      - name: Validate and register queued candidate lineage before evaluation
        id: queued_registration_preflight
        if: ${{ steps.resume_gate.outputs.fast != 'true' && steps.budget_gate.outputs.exhausted != 'true' && steps.oos_repair.outputs.repair_ok == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m research.register_candidate_lineage

      - name: Run bounded autonomous research campaign
        id: controller
        if: ${{ steps.resume_gate.outputs.fast != 'true' && steps.budget_gate.outputs.exhausted != 'true' && steps.oos_repair.outputs.repair_ok == 'true' && steps.queued_registration_preflight.outputs.ready == 'true' && steps.queued_registration_preflight.outputs.created != 'true' }}
        shell: bash
        run: |
          set -o pipefail
          python research/campaign_controller.py 2>&1 | tee controller.log
          rc=${PIPESTATUS[0]}
          if grep -Eq '^CONTROLLER_CONTINUE_REQUEST kind=(RETRY|PROGRESS) ' controller.log; then
            echo "continue=true" >> "$GITHUB_OUTPUT"
            if grep -Eq '^CONTROLLER_CONTINUE_REQUEST kind=RETRY ' controller.log; then
              echo "continue_kind=RETRY" >> "$GITHUB_OUTPUT"
            else
              echo "continue_kind=PROGRESS" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "continue=false" >> "$GITHUB_OUTPUT"
            echo "continue_kind=PROGRESS" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^CAMPAIGN_CONTINUE_DURABLE_QUEUE BC[0-9]+' controller.log; then
            echo "queue_pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "queue_pending=false" >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"

      - name: Register queued candidate lineage after controller queue creation
        id: queued_registration_after_controller
        if: ${{ steps.controller.outcome == 'success' && steps.controller.outputs.queue_pending == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m research.register_candidate_lineage

      - name: External repair research escalation
        id: repair_research
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail
          export REPAIR_FAILURE_JSON="$(python - <<'PY'
          import json
          from pathlib import Path
          text=Path('controller.log').read_text(encoding='utf-8',errors='replace') if Path('controller.log').exists() else ''
          print(json.dumps({
              'error': text.splitlines()[-1] if text.splitlines() else 'controller_failed',
              'step': 'campaign_controller',
              'ci_failure_log_tail': text[-12000:],
          }))
          PY
          )"
          python -m research.repair_research | tee repair-research.log
          if [ -f research/repair_research/latest.json ]; then echo "REPAIR_RESEARCH_EVIDENCE_READY"; fi
          echo "continue=false" >> "$GITHUB_OUTPUT"
          echo "proposal_ready=false" >> "$GITHUB_OUTPUT"

      - name: Upload repair research evidence
        if: ${{ failure() && hashFiles('research/repair_research/latest.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: repair-research-${{ github.run_id }}
          path: |
            research/repair_research/latest.json
            research/repair_research/history
          retention-days: 7

      - name: Persist durable lineage
        if: always()
        run: python -m research.persist_lineage
      - name: Persist autonomous research state
        if: always()
        env:
          CONTINUE: ${{ steps.controller.outputs.continue }}
          CONTINUE_KIND: ${{ steps.controller.outputs.continue_kind }}
          QUEUE_PENDING: ${{ steps.controller.outputs.queue_pending == 'true' || steps.queued_registration_preflight.outputs.created == 'true' || steps.queued_registration_after_controller.outputs.created == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          durable_paths=(research/bc_lifecycle_state.json research/bc_queue.json research/autonomous_candidates research/failure_analysis research/frozen_candidates research/oos research/lineage.jsonl research/discovery research/discovery/absorption_proof.json research/discovery/implementation_absorption_proof.json research/repair_research research/provider_usage.json research/.aios_authority research/aios_conformance_receipt.json research/continuation_intent.json)
          shopt -s nullglob
          validation_files=(research/bc*_validation_result.json)
          status_args=("${durable_paths[@]}" "${validation_files[@]}")
          state_changed=false
          if [ -n "$(git status --porcelain --untracked-files=all -- "${status_args[@]}" 2>/dev/null)" ]; then
            for path in "${status_args[@]}"; do if [ -e "$path" ] || git ls-files --error-unmatch "$path" >/dev/null 2>&1; then git add -A -- "$path"; fi; done
            if git diff --cached --quiet; then echo "STATE_PERSISTENCE_LOST unable to stage controller changes" >&2; exit 1; fi
            if [ "$CONTINUE" = "true" ] || [ "$QUEUE_PENDING" = "true" ]; then
              git commit -m "research: persist authorized continuation prerequisites [skip ci]"
            else
              git commit -m "research: persist autonomous research state [skip ci]"
            fi
            state_changed=true
          else
            echo "No autonomous research state changes to persist."
          fi
          if [ "$state_changed" = "true" ] && ! git push origin HEAD:main; then
            git fetch origin main
            base_sha="$(git rev-parse HEAD^)"
            remote_overlap="$(git diff --name-only "$base_sha..origin/main" -- "${durable_paths[@]}" "${validation_files[@]}" 2>/dev/null || true)"
            if [ -n "$remote_overlap" ]; then
              echo "STATE_PERSISTENCE_CONFLICT remote durable paths changed since base; refusing merge" >&2
              printf '%s\n' "$remote_overlap" >&2
              exit 1
            fi
            git rebase origin/main
            if ! git push origin HEAD:main; then
              echo "STATE_PERSISTENCE_CONFLICT rebase retry rejected; refusing overwrite" >&2
              exit 1
            fi
            echo "STATE_PERSISTENCE_REBASED_ON_LATEST_MAIN"
          fi
          git fetch origin main
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          def remote(path):
              return subprocess.check_output(["git", "show", "origin/main:" + path], text=True)
          local_state=json.loads(Path("research/bc_lifecycle_state.json").read_text())
          remote_state=json.loads(remote("research/bc_lifecycle_state.json"))
          for key in ("campaign_id", "checkpoint_seq", "current_bc", "next_bc"):
              if local_state.get(key) != remote_state.get(key):
                  raise SystemExit("STATE_PERSISTENCE_REMOTE_MISMATCH " + key)
          PY
          echo "STATE_PERSISTED"
          if [ "$CONTINUE" = "true" ] || [ "$QUEUE_PENDING" = "true" ]; then
            if [ "$QUEUE_PENDING" = "true" ]; then
              python -m research.register_candidate_lineage --validate-only
              python - <<'PY'
          import json, subprocess
          def remote(path):
              return subprocess.check_output(["git", "show", "origin/main:" + path], text=True)
          state=json.loads(remote("research/bc_lifecycle_state.json"))
          queue=json.loads(remote("research/bc_queue.json"))
          bc=int(state["next_bc"])
          candidate=json.loads(remote(f"research/autonomous_candidates/BC{bc}.json"))
          failure=json.loads(remote(f"research/failure_analysis/BC{bc-1}.json"))
          lineage=[json.loads(line) for line in remote("research/lineage.jsonl").splitlines() if line.strip()]
          experiment_id=f"BC{bc}:REGISTRATION:{candidate['candidate_hash']}"
          record=next((entry for entry in lineage if entry.get("experiment_id")==experiment_id),None)
          if state.get("current_bc") != bc or not any(isinstance(x,dict) and x.get("bc")==bc and x.get("candidate_hash")==candidate.get("candidate_hash") for x in queue):
              raise SystemExit("DURABLE_QUEUE_AUTHORIZATION_CHECKPOINT_OR_HASH_MISMATCH")
          if failure.get("bc") != bc-1 or failure.get("decision") not in {"REJECT","REJECT_BC"}:
              raise SystemExit("DURABLE_QUEUE_AUTHORIZATION_PARENT_FAILURE_INVALID")
          if not record or record.get("verdict") != "REGISTERED" or (record.get("result") or {}).get("candidate_hash") != candidate.get("candidate_hash"):
              raise SystemExit("DURABLE_QUEUE_AUTHORIZATION_LINEAGE_NOT_PERSISTED")
          print(f"DURABLE_QUEUE_AUTHORIZATION_VERIFIED bc={bc} candidate_hash={candidate['candidate_hash']} checkpoint_seq={state['checkpoint_seq']}")
          PY
            fi
            python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          def remote(path):
              return subprocess.check_output(["git", "show", "origin/main:" + path], text=True)
          state=json.loads(remote("research/bc_lifecycle_state.json"))
          old={}
          try: old=json.loads(remote("research/continuation_intent.json"))
          except Exception: pass
          history=list(old.get("receipt_history", []))
          if old.get("status") == "DISPATCHED":
              history.append({k:old.get(k) for k in ("status","created_by_run_id","dispatch_run_id","dispatch_run_url","dispatch_head_sha","checkpoint_seq")})
          intent={
              "schema_version":1,"status":"PENDING","campaign_id":state.get("campaign_id"),
              "next_bc":state.get("next_bc"),"current_bc":state.get("current_bc"),
              "checkpoint_seq":state.get("checkpoint_seq"),"created_by_run_id":int(os.environ["GITHUB_RUN_ID"]),
              "target_ref":"main","receipt_history":history,
          }
          if os.environ.get("QUEUE_PENDING") == "true":
              bc=int(state["next_bc"])
              candidate=json.loads(remote(f"research/autonomous_candidates/BC{bc}.json"))
              intent["authorization_type"]="DURABLE_QUEUE"
              intent["authorized_candidate_hash"]=candidate["candidate_hash"]
          Path("research/continuation_intent.json").write_text(json.dumps(intent,indent=2,sort_keys=True)+"\n")
          PY
            git add research/continuation_intent.json
            git commit -m "research: persist continuation authorization after durable state [skip ci]"
            if ! git push origin HEAD:main; then
              git fetch origin main
              remote_intent="$(git show origin/main:research/continuation_intent.json 2>/dev/null || echo '{}')"
              remote_source="$(jq -r '.created_by_run_id // 0' <<<"$remote_intent")"
              remote_status="$(jq -r '.status // ""' <<<"$remote_intent")"
              if [ "$remote_source" != "$GITHUB_RUN_ID" ] || [ "$remote_status" != "PENDING" ]; then
                echo "CONTINUATION_INTENT_PERSISTENCE_CONFLICT; refusing overwrite" >&2
                exit 1
              fi
            fi
            git fetch origin main
            remote_intent="$(git show origin/main:research/continuation_intent.json)"
            test "$(jq -r '.status' <<<"$remote_intent")" = "PENDING"
            test "$(jq -r '.created_by_run_id' <<<"$remote_intent")" = "$GITHUB_RUN_ID"
            test "$(jq -r '.checkpoint_seq' <<<"$remote_intent")" = "$(jq -r '.checkpoint_seq' <(git show origin/main:research/bc_lifecycle_state.json))"
            if [ "$QUEUE_PENDING" = "true" ]; then
              auth_bc="$(jq -r '.next_bc' <<<"$remote_intent")"
              auth_hash="$(jq -r '.authorized_candidate_hash' <<<"$remote_intent")"
              echo "CONTROLLER_CONTINUE_AUTHORIZED kind=PROGRESS reason=DURABLE_QUEUE bc=$auth_bc candidate_hash=$auth_hash checkpoint_seq=$(jq -r '.checkpoint_seq' <<<"$remote_intent")"
            else
              auth_kind="$CONTINUE_KIND"
              if [ "$auth_kind" != "RETRY" ]; then auth_kind="PROGRESS"; fi
              echo "CONTROLLER_CONTINUE_AUTHORIZED kind=$auth_kind reason=POST_PERSISTENCE checkpoint_seq=$(jq -r '.checkpoint_seq' <<<"$remote_intent")"
            fi
          fi
# G4B autonomous continuation trigger: durable state remains authoritative.
