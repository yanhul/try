name: BC Research Controller

on:
  workflow_dispatch:
  push:
    branches:
      - research-controller
      - 'bc[0-9]*'
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read

concurrency:
  group: bc-research-controller
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test runner
        run: python -m pip install --upgrade pytest

      - name: Run strict BC controller
        run: python research/bc_controller.py
