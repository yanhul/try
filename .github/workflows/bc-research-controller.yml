name: BC Research Controller

# Durable bounded campaign: fixed policy + durable controller resume.
# G4B autonomous launch lane.
# Agent cannot modify policy, evidence, promotion, budget, or terminal rules.
# Each invocation executes at most one BC and persists before the next dispatch.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'bc[0-9]*'
    paths:
      - 'research/**/*.py'
      - 'engine/**/*.py'
      - 'research/campaign_policy.json'
      - 'tests/**'
      - '.github/workflows/bc-research-controller.yml'

concurrency:
  group: try-bc-research-controller-main
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  research:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RESEARCH_MAX_ITERATIONS: 1
      RESEARCH_MAX_RESUME_RETRIES: 10
      RESEARCH_AGENT_COMMAND: python research/provider_router.py
      RESEARCH_PROVIDER_ORDER: gemini
      RESEARCH_PROVIDER_MIN_INTERVAL_SECONDS: 8
      RESEARCH_PROVIDER_RATE_RETRIES: 3
      RESEARCH_PROVIDER_RPD_LIMIT: 450
      RESEARCH_PROVIDER_BACKOFF_CAP_SECONDS: 120
      RESEARCH_PROVIDER_CONTEXT_CHAR_LIMIT: 12000
      RESEARCH_PROVIDER_MAX_FORBIDDEN_FINGERPRINTS: 80
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash-lite
      GITHUB_TOKEN: ${{ github.token }}
      AIOS_SOURCE: ${{ github.workspace }}/aios-authority
      AIOS_AUTHORITY_SECRET: ${{ secrets.AIOS_AUTHORITY_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rebase controller workspace onto latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          echo "CONTROLLER_BASE=$(git rev-parse HEAD)"
      - name: Checkout pinned AIOS authority
        uses: actions/checkout@v4
        with:
          repository: yanhul/AIOS
          ref: 151f386683934edd6e124d1ae69bd95a68b3ecbf
          path: aios-authority
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Run research feature and harness tests
        run: python -m pytest -q tests/test_feature_library.py tests/test_harness_contracts.py tests/test_autonomous_hypothesis.py tests/test_evidence_calibration.py tests/test_campaign_controller.py tests/test_provider_router_contract.py tests/test_system_ingestion.py tests/test_hypothesis_novelty.py tests/test_campaign_terminal_contract.py tests/test_oos_lifecycle_target.py tests/test_repair_research.py
      - name: Run AIOS static conformance
        run: python research/aios_conformance.py
      - name: Run AIOS runtime adversarial conformance
        run: python -m research.adversarial_conformance
      - name: Bootstrap strict research lifecycle
        run: python research/bootstrap_lifecycle.py
      - name: Check strict fast-resume eligibility
        id: resume_gate
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_OUTPUT_PATH="$GITHUB_OUTPUT"
          python - <<'PY'
          import json, os
          from pathlib import Path
          state_path=Path('research/bc_lifecycle_state.json')
          state=json.loads(state_path.read_text()) if state_path.exists() else {}
          phase=state.get('phase'); error=str(state.get('last_error') or '')
          retry=int(state.get('retry_count',0)); current_bc=state.get('current_bc')
          required=[Path('research/bc_queue.json'),Path('research/autonomous_candidates'),Path('research/failure_analysis'),Path('research/discovery')]
          retryable_error=error.startswith(('PROVIDER_FAIL ','HOLD_PROVIDER_ROUTER','HOLD_PROVIDER_REPAIR','HOLD_EVALUATOR','PROVIDER_CALIBRATION_FAIL ','HOLD_OOS_EXECUTOR_OR_AUTHORITY'))
          eligible=(not state.get('campaign_terminal') and phase=='WAIT_RETRY' and retryable_error and 0<=retry<10 and isinstance(current_bc,int) and all(p.exists() for p in required))
          with Path(os.environ['GITHUB_OUTPUT_PATH']).open('a') as out: out.write(f"fast={'true' if eligible else 'false'}\n")
          print(f"FAST_RESUME_{'ELIGIBLE' if eligible else 'INELIGIBLE'} bc={current_bc} retry={retry} error={error}")
          PY
      - name: Check durable campaign budget before discovery
        id: budget_gate
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_OUTPUT_PATH="$GITHUB_OUTPUT"
          python - <<'PY'
          import os,json
          from pathlib import Path
          from research.campaign_controller import _start_new_campaign_epoch,reconcile_campaign_state
          policy=json.loads(Path('research/campaign_policy.json').read_text()); state_path=Path('research/bc_lifecycle_state.json'); state=json.loads(state_path.read_text()) if state_path.exists() else {}; budget=int(policy['max_screening_candidates']); _start_new_campaign_epoch(state,policy); _,start,screened=reconcile_campaign_state(state,budget); exhausted=bool(state.get('campaign_terminal')) or screened>=budget; Path(os.environ['GITHUB_OUTPUT_PATH']).open('a').write(f"exhausted={'true' if exhausted else 'false'}\n"); print(f"CAMPAIGN_BUDGET_{'EXHAUSTED' if exhausted else 'AVAILABLE'} start_bc={start} screened={screened}/{budget}");
          if exhausted: state_path.write_text(json.dumps(state,indent=2,sort_keys=True)+'\n')
          PY
      - name: Broad public-source discovery
        if: ${{ steps.resume_gate.outputs.fast != 'true' && steps.budget_gate.outputs.exhausted != 'true' }}
        run: python research/discovery_scout.py
      - name: Ingest every discovered system
        if: ${{ steps.resume_gate.outputs.fast != 'true' && steps.budget_gate.outputs.exhausted != 'true' }}
        run: python research/discovery/system_ingestion.py
      - name: Audit executable source lanes
        if: ${{ steps.resume_gate.outputs.fast != 'true' && steps.budget_gate.outputs.exhausted != 'true' }}
        run: python research/discovery/source_audit.py
      - name: Compile constrained discovery primitives
        if: ${{ steps.resume_gate.outputs.fast != 'true' && steps.budget_gate.outputs.exhausted != 'true' }}
        run: python research/discovery_compiler.py
      - name: Repair durable OOS evidence before campaign resume
        id: oos_repair
        if: ${{ steps.resume_gate.outputs.fast != 'true' && steps.budget_gate.outputs.exhausted != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python research/repair_oos_evidence.py
          echo "repair_ok=true" >> "$GITHUB_OUTPUT"
      - name: Run bounded autonomous research campaign
        id: controller
        if: ${{ steps.resume_gate.outputs.fast != 'true' && steps.budget_gate.outputs.exhausted != 'true' && steps.oos_repair.outputs.repair_ok == 'true' }}
        shell: bash
        run: |
          set -o pipefail
          python research/campaign_controller.py 2>&1 | tee controller.log
          rc=${PIPESTATUS[0]}
          if grep -Eq 'CONTROLLER_CANDIDATE_QUEUED|CONTROLLER_NEXT BC|CONTROLLER_NEXT_AFTER_OOS_FAIL|CONTROLLER_AUTO_RESUME|CAMPAIGN_CONTINUE_DURABLE_QUEUE|CAMPAIGN_CONTINUE_RETRY|CAMPAIGN_CONTINUE ' controller.log && ! grep -Eq 'CONTROLLER_MANUAL_HOLD|CAMPAIGN_HOLD|CONTROLLER_DECISION HOLD_|AIOS_AUTHORITY_HOLD'; then
            echo "continue=true" >> "$GITHUB_OUTPUT"
          elif grep -Eq 'CAMPAIGN_CONTINUE_RETRY|CONTROLLER_AUTO_RESUME' controller.log && ! grep -Eq 'CONTROLLER_MANUAL_HOLD|CAMPAIGN_HOLD|CONTROLLER_DECISION HOLD_|AIOS_AUTHORITY_HOLD' controller.log; then
            echo "continue=true" >> "$GITHUB_OUTPUT"
          else
            echo "continue=false" >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"
      - name: External repair research escalation
        id: repair_research
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail
          export REPAIR_FAILURE_JSON="$(python - <<'PY'
          import json
          from pathlib import Path
          text=Path('controller.log').read_text(encoding='utf-8',errors='replace') if Path('controller.log').exists() else ''
          print(json.dumps({
              'error': text.splitlines()[-1] if text.splitlines() else 'controller_failed',
              'step': 'campaign_controller',
              'ci_failure_log_tail': text[-12000:],
          }))
          PY
          )"
          python -m research.repair_research | tee repair-research.log
          if [ -f research/repair_research/latest.json ]; then echo "REPAIR_RESEARCH_EVIDENCE_READY"; fi
          echo "continue=false" >> "$GITHUB_OUTPUT"
          echo "proposal_ready=false" >> "$GITHUB_OUTPUT"

      - name: Upload repair research evidence
        if: ${{ failure() && hashFiles('research/repair_research/latest.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: repair-research-${{ github.run_id }}
          path: |
            research/repair_research/latest.json
            research/repair_research/history
          retention-days: 7

      - name: Persist durable lineage
        if: always()
        run: python -m research.persist_lineage
      - name: Persist autonomous research state
        if: always()
        env:
          CONTINUE: ${{ steps.controller.outputs.continue }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          durable_paths=(research/bc_lifecycle_state.json research/bc_queue.json research/autonomous_candidates research/failure_analysis research/frozen_candidates research/oos research/lineage.jsonl research/discovery research/repair_research research/provider_usage.json research/.aios_authority research/continuation_intent.json)
          shopt -s nullglob
          validation_files=(research/bc*_validation_result.json)
          status_args=("${durable_paths[@]}" "${validation_files[@]}")
          if [ "$CONTINUE" = "true" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('research/bc_lifecycle_state.json').read_text())
          intent={
              'schema_version': 1,
              'status': 'PENDING',
              'campaign_id': state.get('campaign_id'),
              'next_bc': state.get('next_bc'),
              'current_bc': state.get('current_bc'),
              'checkpoint_seq': state.get('checkpoint_seq'),
              'created_by_run_id': int('${{ github.run_id }}'),
              'target_ref': 'main',
          }
          Path('research/continuation_intent.json').write_text(json.dumps(intent,indent=2,sort_keys=True)+'\n')
          PY
          else
            rm -f research/continuation_intent.json
          fi
          if [ -n "$(git status --porcelain --untracked-files=all -- "${status_args[@]}" 2>/dev/null)" ]; then
            for path in "${status_args[@]}"; do if [ -e "$path" ] || git ls-files --error-unmatch "$path" >/dev/null 2>&1; then git add -A -- "$path"; fi; done
            if git diff --cached --quiet; then echo "STATE_PERSISTENCE_LOST unable to stage controller changes" >&2; exit 1; fi
            if [ "$CONTINUE" = "true" ]; then git commit -m "research: continue autonomous lifecycle [skip ci]"; else git commit -m "research: persist autonomous research state [skip ci]"; fi
          else
            echo "No autonomous research state changes to persist."
            exit 0
          fi
          if ! git push origin HEAD:main; then
            git fetch origin main
            overlap="$(git diff --name-only HEAD..origin/main -- ${durable_paths[@]} ${validation_files[@]} 2>/dev/null || true)"
            if [ -n "$overlap" ]; then
              echo "STATE_PERSISTENCE_CONFLICT durable paths changed on remote; refusing merge" >&2
              printf '%s\n' "$overlap" >&2
              exit 1
            fi
            git rebase origin/main
            if ! git push origin HEAD:main; then
              echo "STATE_PERSISTENCE_CONFLICT rebase retry rejected; refusing overwrite" >&2
              exit 1
            fi
            echo "STATE_PERSISTENCE_REBASED_ON_LATEST_MAIN"
          fi
          echo "STATE_PERSISTED"
# G4B autonomous continuation trigger: durable state remains authoritative.
# Family-specific primitive frontier hardening: preserve durable state and continue.
# Syntax repair validation trigger.
# Final syntax repair.
# Provider file restored with complete main lifecycle.
# Test contract alignment trigger.
