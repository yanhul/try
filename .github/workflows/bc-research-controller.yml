name: BC Research Controller

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'bc[0-9]*'
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: bc-research-controller
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RESEARCH_MAX_ITERATIONS: 8
      RESEARCH_AGENT_COMMAND: ${{ vars.RESEARCH_AGENT_COMMAND }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Run strict autonomous BC controller
        run: python research/bc_controller.py
      - name: Persist autonomous research state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/bc_lifecycle_state.json research/bc_queue.json research/autonomous_candidates || true
          git diff --cached --quiet && exit 0
          git commit -m "research: persist autonomous controller state [skip ci]"
          git push
