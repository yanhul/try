name: BC Research Controller

# Durable bounded campaign: fixed policy + durable controller resume.
# Agent cannot modify policy, evidence, promotion, budget, or terminal rules.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches:
      - main
      - 'bc[0-9]*'

concurrency:
  group: try-bc-research-controller-main
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RESEARCH_MAX_ITERATIONS: 8
      RESEARCH_MAX_RESUME_RETRIES: 3
      RESEARCH_AGENT_COMMAND: python research/provider_router.py
      RESEARCH_PROVIDER_ORDER: gemini
      # Gemini Flash is currently 15 RPM / 250k TPM. Keep substantial headroom.
      RESEARCH_PROVIDER_MIN_INTERVAL_SECONDS: 5
      RESEARCH_PROVIDER_RATE_RETRIES: 1
      RESEARCH_PROVIDER_BACKOFF_CAP_SECONDS: 120
      RESEARCH_PROVIDER_CONTEXT_CHAR_LIMIT: 12000
      RESEARCH_PROVIDER_MAX_FORBIDDEN_FINGERPRINTS: 80
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.1-flash-lite
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Run research feature and harness tests
        run: python -m pytest -q tests/test_feature_library.py tests/test_harness_contracts.py tests/test_autonomous_hypothesis.py tests/test_evidence_calibration.py tests/test_campaign_controller.py tests/test_provider_router_contract.py tests/test_system_ingestion.py
      - name: Run AIOS static conformance
        run: python research/aios_conformance.py
      - name: Run AIOS runtime adversarial conformance
        run: python research/adversarial_conformance.py
      - name: Bootstrap strict research lifecycle
        run: python research/bootstrap_lifecycle.py
      - name: Check strict fast-resume eligibility
        id: resume_gate
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_OUTPUT_PATH="$GITHUB_OUTPUT"
          python - <<'PY'
          import json, os
          from pathlib import Path
          state_path=Path('research/bc_lifecycle_state.json')
          state=json.loads(state_path.read_text()) if state_path.exists() else {}
          phase=state.get('phase'); error=str(state.get('last_error') or '')
          retry=int(state.get('retry_count',0)); current_bc=state.get('current_bc')
          required=[Path('research/bc_queue.json'),Path('research/autonomous_candidates'),Path('research/failure_analysis'),Path('research/discovery')]
          retryable_error=error.startswith(('PROVIDER_FAIL ','HOLD_PROVIDER_ROUTER'))
          eligible=(not state.get('campaign_terminal') and phase=='WAIT_RETRY' and retryable_error and 0<=retry<3 and isinstance(current_bc,int) and all(p.exists() for p in required))
          with Path(os.environ['GITHUB_OUTPUT_PATH']).open('a') as out: out.write(f"fast={'true' if eligible else 'false'}\n")
          print(f"FAST_RESUME_{'ELIGIBLE' if eligible else 'INELIGIBLE'} bc={current_bc} retry={retry} error={error}")
          PY
      - name: Broad public-source discovery
        if: ${{ steps.resume_gate.outputs.fast != 'true' }}
        run: python research/discovery_scout.py
      - name: Ingest every discovered system
        if: ${{ steps.resume_gate.outputs.fast != 'true' }}
        run: python research/discovery/system_ingestion.py
      - name: Audit executable source lanes
        if: ${{ steps.resume_gate.outputs.fast != 'true' }}
        run: python research/discovery/source_audit.py
      - name: Compile constrained discovery primitives
        if: ${{ steps.resume_gate.outputs.fast != 'true' }}
        run: python research/discovery_compiler.py
      - name: Run bounded autonomous research campaign
        id: controller
        shell: bash
        run: |
          set -o pipefail
          python research/campaign_controller.py 2>&1 | tee controller.log
          rc=${PIPESTATUS[0]}
          if grep -Eq 'CAMPAIGN_CONTINUE|CONTROLLER_NEXT BC' controller.log && ! grep -Eq 'CAMPAIGN_HOLD|CONTROLLER_DECISION HOLD_|PROVIDER_ROUTER_HOLD|PROVIDER_FAIL|AIOS_AUTHORITY_HOLD|HOLD_' controller.log; then echo "continue=true" >> "$GITHUB_OUTPUT"; else echo "continue=false" >> "$GITHUB_OUTPUT"; fi
          exit "$rc"
      - name: Persist durable lineage
        if: always()
        run: python research/persist_lineage.py
      - name: Persist autonomous research state
        if: always()
        env:
          CONTINUE: ${{ steps.controller.outputs.continue }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/try-state
          durable_paths=(research/bc_lifecycle_state.json research/bc_queue.json research/autonomous_candidates research/failure_analysis research/frozen_candidates research/oos research/lineage.jsonl research/discovery)
          for path in "${durable_paths[@]}"; do if [ -e "$path" ]; then cp -a "$path" "/tmp/try-state/$(basename "$path")"; fi; done
          shopt -s nullglob
          validation_files=(research/bc*_validation_result.json)
          for path in "${validation_files[@]}"; do cp -a "$path" "/tmp/try-state/$(basename "$path")"; done
          controller_state_changed=false; status_args=()
          for path in "${durable_paths[@]}" "${validation_files[@]}"; do if [ -e "$path" ] || git ls-files --error-unmatch "$path" >/dev/null 2>&1; then status_args+=("$path"); fi; done
          if [ "${#status_args[@]}" -gt 0 ] && [ -n "$(git status --porcelain --untracked-files=all -- "${status_args[@]}")" ]; then controller_state_changed=true; fi
          pushed=false
          for attempt in 1 2 3 4 5; do
            for path in "${durable_paths[@]}" "${validation_files[@]}"; do if [ -e "$path" ] || git ls-files --error-unmatch "$path" >/dev/null 2>&1; then git add -A -- "$path"; fi; done
            if git diff --cached --quiet; then if [ "$controller_state_changed" = "true" ]; then echo "STATE_PERSISTENCE_LOST controller produced durable changes but nothing can be staged" >&2; exit 1; fi; echo "No autonomous research state changes to persist."; pushed=true; break; fi
            if [ "$CONTINUE" = "true" ]; then git commit -m "research: continue autonomous lifecycle [skip ci]"; else git commit -m "research: persist autonomous research state [skip ci]"; fi
            if git push origin HEAD:main; then echo "STATE_PERSISTED"; pushed=true; break; fi
            git fetch origin main; git reset --hard origin/main
            for item in /tmp/try-state/*; do [ -e "$item" ] || continue; base="$(basename "$item")"; case "$base" in bc_lifecycle_state.json|bc_queue.json|lineage.jsonl|bc*_validation_result.json) cp -a "$item" "research/$base" ;; autonomous_candidates|failure_analysis|frozen_candidates|oos|discovery) rm -rf "research/$base" && cp -a "$item" "research/$base" ;; esac; done
            sleep $((attempt * 2)); validation_files=(research/bc*_validation_result.json)
          done
          if [ "$pushed" != "true" ]; then echo "Unable to persist state after retries" >&2; exit 1; fi
      - name: Auto-resume non-terminal campaign
        if: ${{ steps.controller.outputs.continue == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          sleep 60
          gh workflow run bc-research-controller.yml --ref main
