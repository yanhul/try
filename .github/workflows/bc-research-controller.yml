name: BC Research Controller

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'bc[0-9]*'
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: bc-research-controller
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RESEARCH_MAX_ITERATIONS: 8
      RESEARCH_AGENT_COMMAND: python research/provider_router.py
      RESEARCH_PROVIDER_ORDER: gemini,deepseek
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.1-flash-lite
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: deepseek-v4-flash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Verify Gemini API
        run: python research/gemini_smoke_test.py
      - name: Bootstrap strict research lifecycle
        run: python research/bootstrap_lifecycle.py
      - name: Run strict autonomous trading research loop
        run: python research/bc_controller.py
      - name: Persist autonomous research state
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          found=0
          for path in research/bc_lifecycle_state.json research/bc_queue.json research/autonomous_candidates research/failure_analysis; do
            if [ -e "$path" ]; then
              git add "$path"
              found=1
            fi
          done
          if [ "$found" -eq 0 ] || git diff --cached --quiet; then
            echo "No autonomous research state changes to persist."
            exit 0
          fi
          git commit -m "research: persist autonomous controller state [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            fi
            git rebase --abort 2>/dev/null || true
            git reset --soft origin/main
            git commit -m "research: persist autonomous controller state [skip ci]" || true
            git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          echo "Unable to persist state after retries" >&2
          exit 1
