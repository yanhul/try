name: BC Research Controller

# Durable bounded campaign: fixed policy + durable controller resume.
# Agent cannot modify policy, evidence, promotion, budget, or terminal rules.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'bc[0-9]*'
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: bc-research-controller
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RESEARCH_MAX_ITERATIONS: 8
      RESEARCH_MAX_RESUME_RETRIES: 3
      RESEARCH_AGENT_COMMAND: python research/provider_router.py
      RESEARCH_PROVIDER_ORDER: gemini,deepseek
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.1-flash-lite
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: deepseek-v4-flash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Run harness contract tests
        run: python -m pytest -q tests/test_harness_contracts.py tests/test_autonomous_hypothesis.py
      - name: Run AIOS static conformance
        run: python research/aios_conformance.py
      - name: Run AIOS runtime adversarial conformance
        run: python research/adversarial_conformance.py
      - name: Probe Gemini API
        continue-on-error: true
        run: python research/gemini_smoke_test.py
      - name: Bootstrap strict research lifecycle
        run: python research/bootstrap_lifecycle.py
      - name: Run bounded autonomous research campaign
        id: controller
        shell: bash
        run: |
          set -o pipefail
          python research/campaign_controller.py 2>&1 | tee controller.log
          rc=${PIPESTATUS[0]}
          if grep -Eq 'CAMPAIGN_CONTINUE|CONTROLLER_(NEXT BC|AUTO_RESUME)' controller.log; then
            echo "continue=true" >> "$GITHUB_OUTPUT"
          else
            echo "continue=false" >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"
      - name: Persist durable lineage
        if: always()
        run: python research/persist_lineage.py
      - name: Persist autonomous research state
        if: always()
        env:
          CONTINUE: ${{ steps.controller.outputs.continue }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/try-state
          for path in research/bc_lifecycle_state.json research/bc_queue.json research/autonomous_candidates research/failure_analysis research/frozen_candidates research/oos research/lineage.jsonl; do
            if [ -e "$path" ]; then cp -a "$path" "/tmp/try-state/$(basename "$path")"; fi
          done
          pushed=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for item in /tmp/try-state/*; do
              [ -e "$item" ] || continue
              base="$(basename "$item")"
              case "$base" in
                bc_lifecycle_state.json|bc_queue.json|lineage.jsonl) cp -a "$item" "research/$base" ;;
                autonomous_candidates|failure_analysis|frozen_candidates|oos) rm -rf "research/$base" && cp -a "$item" "research/$base" ;;
              esac
            done
            git add research/bc_lifecycle_state.json research/bc_queue.json research/autonomous_candidates research/failure_analysis research/frozen_candidates research/oos research/lineage.jsonl 2>/dev/null || true
            if git diff --cached --quiet; then echo "No autonomous research state changes to persist."; pushed=true; break; fi
            if [ "$CONTINUE" = "true" ]; then git commit -m "research: continue autonomous lifecycle [skip ci]"; else git commit -m "research: persist autonomous research state [skip ci]"; fi
            if git push origin HEAD:main; then echo "STATE_PERSISTED"; pushed=true; break; fi
            git reset --hard origin/main; sleep $((attempt * 2))
          done
          if [ "$pushed" != "true" ]; then echo "Unable to persist state after retries" >&2; exit 1; fi
      - name: Auto-resume non-terminal campaign
        if: ${{ steps.controller.outputs.continue == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          sleep 10
          gh workflow run bc-research-controller.yml --ref main
