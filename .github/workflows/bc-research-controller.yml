name: BC Research Controller

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'bc[0-9]*'
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: bc-research-controller
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RESEARCH_MAX_ITERATIONS: 8
      RESEARCH_AGENT_COMMAND: python research/provider_router.py
      RESEARCH_PROVIDER_ORDER: gemini,deepseek
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.1-flash-lite
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: deepseek-v4-flash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Verify Gemini API
        run: python research/gemini_smoke_test.py
      - name: Bootstrap strict research lifecycle
        run: python research/bootstrap_lifecycle.py
      - name: Run strict autonomous trading research loop
        id: controller
        shell: bash
        run: |
          set -o pipefail
          python research/bc_controller.py 2>&1 | tee controller.log
          rc=${PIPESTATUS[0]}
          if grep -q 'CONTROLLER_NEXT BC' controller.log; then
            echo "continue=true" >> "$GITHUB_OUTPUT"
          else
            echo "continue=false" >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"
      - name: Persist autonomous research state
        if: always()
        env:
          CONTINUE: ${{ steps.controller.outputs.continue }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Snapshot only files produced by this run. Never merge generated
          # lifecycle state with a concurrently advanced main branch.
          mkdir -p /tmp/try-state
          for path in research/bc_lifecycle_state.json research/bc_queue.json research/autonomous_candidates research/failure_analysis; do
            if [ -e "$path" ]; then
              cp -a "$path" "/tmp/try-state/$(basename "$path")"
            fi
          done

          # Rebase is intentionally avoided here: generated JSON is an
          # authoritative state transition and must not be conflict-merged.
          # Refresh main, reset to it, then overlay this run's generated state.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            for item in /tmp/try-state/*; do
              [ -e "$item" ] || continue
              case "$(basename "$item")" in
                bc_lifecycle_state.json) cp -a "$item" research/bc_lifecycle_state.json ;;
                bc_queue.json) cp -a "$item" research/bc_queue.json ;;
                autonomous_candidates) rm -rf research/autonomous_candidates && cp -a "$item" research/autonomous_candidates ;;
                failure_analysis) rm -rf research/failure_analysis && cp -a "$item" research/failure_analysis ;;
              esac
            done

            git add research/bc_lifecycle_state.json research/bc_queue.json research/autonomous_candidates research/failure_analysis 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "No autonomous research state changes to persist."
              exit 0
            fi

            if [ "$CONTINUE" = "true" ]; then
              git commit -m "research: continue Gemini autonomous lifecycle"
            else
              git commit -m "research: persist autonomous research state [skip ci]"
            fi

            if git push origin HEAD:main; then
              echo "STATE_PERSISTED"
              exit 0
            fi
            git reset --hard origin/main
            sleep $((attempt * 2))
          done
          echo "Unable to persist state after retries" >&2
          exit 1
