name: Strict Full TRY Suite

on:
  push:
    branches: ['**']
    paths:
      - 'engine/**'
      - 'research/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'engine/**'
      - 'research/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'pyproject.toml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Checkout AIOS authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: yanhul/AIOS
          ref: 1979e828ee2b16dbd0601e2404abdc4a560dab49
          path: aios-authority
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Run full suite with external AIOS authority
        env:
          AIOS_ROOT: ${{ github.workspace }}/aios-authority
          AIOS_SOURCE: ${{ github.workspace }}/aios-authority
        run: python -m pytest -q
