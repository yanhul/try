name: Strict Full TRY Suite

on:
  pull_request:
    branches: [main]
    paths:
      - "engine/algorithm_compiler/**"
      - "engine/aios_boundary.py"
      - "tests/test_algorithm_compiler.py"
      - "tests/test_algorithm_aios_integration.py"
      - "docs/ALGORITHM_COMPILER_P0.md"
      - ".github/workflows/strict-full-suite.yml"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout AIOS authority
        uses: actions/checkout@v4
        with:
          repository: yanhul/AIOS
          ref: 665e73a1c4a9a8c283d28becd0a15adc6efd0f17
          path: aios-authority
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Run full suite with external AIOS authority
        env:
          AIOS_ROOT: ${{ github.workspace }}/aios-authority
          AIOS_SOURCE: ${{ github.workspace }}/aios-authority
        run: python -m pytest -q
