name: Strict Full TRY Suite

on:
  pull_request:
    branches: [main]
    paths:
      - "engine/algorithm_compiler/**"
      - "engine/aios_boundary.py"
      - "tests/test_algorithm_compiler.py"
      - "tests/test_algorithm_aios_integration.py"
      - "docs/ALGORITHM_COMPILER_P0.md"
      - "docs/ALGORITHM_WORKER_PROVENANCE_P1.md"
      - "cloudflare/try-repair-worker/src/entry.py"
      - "cloudflare/try-repair-worker/src/algorithm_runtime.py"
      - "cloudflare/try-repair-worker/src/algorithm_entry.py"
      - "cloudflare/try-repair-worker/tests/test_entry.py"
      - "cloudflare/try-repair-worker/tests/test_algorithm_runtime.py"
      - "cloudflare/try-repair-worker/tests/test_algorithm_durable_lifecycle.py"
      - "tests/test_algorithm_worker_provenance.py"
      - ".github/workflows/strict-full-suite.yml"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout AIOS authority
        uses: actions/checkout@v4
        with:
          repository: yanhul/AIOS
          ref: 21ed3966e8a8bab0ae9c63516316dccbfb76655f
          path: aios-authority
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest cryptography
      - name: Run full suite with external AIOS authority
        env:
          AIOS_ROOT: ${{ github.workspace }}/aios-authority
          AIOS_SOURCE: ${{ github.workspace }}/aios-authority
        run: python -m pytest -o addopts='' -q
