name: Strict Full TRY Suite

on:
  push:
    branches: ['**']
    paths:
      - 'engine/**'
      - 'research/**'
      - 'tests/**'
      - '.github/workflows/strict-full-suite.yml'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'engine/**'
      - 'research/**'
      - 'tests/**'
      - '.github/workflows/strict-full-suite.yml'
      - 'pyproject.toml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - run: python -m pytest -q
