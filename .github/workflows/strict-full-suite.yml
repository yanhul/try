name: Strict Full TRY Suite

on:
  push:
    branches: ['**']
    paths:
      - 'engine/**'
      - 'research/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'engine/**'
      - 'research/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'pyproject.toml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Checkout AIOS authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: yanhul/AIOS
          ref: 6db3de5f6a26e3bb85245a7c5cb95fe3405b90a7
          path: aios-authority
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Run full suite with external AIOS authority
        env:
          AIOS_ROOT: ${{ github.workspace }}/aios-authority
          AIOS_SOURCE: ${{ github.workspace }}/aios-authority
        run: python -m pytest -q
