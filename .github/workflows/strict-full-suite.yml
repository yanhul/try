name: Strict Full TRY Suite

on:
  push:
    branches: ['**']
    paths:
      - 'engine/**'
      - 'research/**'
      - 'tests/**'
      - '.github/workflows/strict-full-suite.yml'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'engine/**'
      - 'research/**'
      - 'tests/**'
      - '.github/workflows/strict-full-suite.yml'
      - 'pyproject.toml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout AIOS authority
        uses: actions/checkout@v4
        with:
          repository: yanhul/AIOS
          ref: absorb/verl-strict-lineage
          path: aios-authority
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Run full suite with external AIOS authority
        env:
          AIOS_ROOT: ${{ github.workspace }}/aios-authority
          AIOS_SOURCE: ${{ github.workspace }}/aios-authority
        run: python -m pytest -q
