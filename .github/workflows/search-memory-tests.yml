name: Search Memory Tests

on:
  workflow_dispatch:

jobs:
  search-memory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --upgrade pytest
      - name: Run search-memory regression tests
        run: python -m pytest -q tests/test_search_memory.py
